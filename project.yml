name: WorkoutTracker
options:
  bundleIdPrefix: com.sunnypatel
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
  # Icon Composer .icon bundles are packages; without this XcodeGen expands
  # their contents as individual files and Xcode stops recognizing the icon
  # (https://github.com/yonaskolb/XcodeGen/issues/1556).
  fileTypes:
    icon:
      file: true
      buildPhase: resources
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

# Dev-flavor hooks for TestFlight PR builds (docs/ci/testflight.md): the PR
# release workflow overrides these on the xcodebuild command line
# (BUNDLE_ID_SUFFIX=.dev, APP_DISPLAY_NAME="WT Dev", APPICON_NAME=AppIconDev)
# and app + widget flip in lockstep. Local and stable builds use these
# defaults and are unchanged.
settings:
  base:
    BUNDLE_ID_SUFFIX: ""
    APP_DISPLAY_NAME: WorkoutTracker
    APPICON_NAME: AppIcon

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    majorVersion: 0.58.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.2

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources: [WorkoutTracker, WorkoutShared]
    info:
      path: WorkoutTracker/Info.plist
      properties:
        GIDClientID: $(GID_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: true
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # App Store validation (ITMS-90474) requires all four orientations
        # unless the app opts into requires-full-screen; iPad multitasking
        # needs the full set.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Stable marketing version — hand-bump here at real releases. This is
        # the single source: the release workflows copy it to the widget and
        # stamp CFBundleVersion (= run number) at archive time.
        CFBundleShortVersionString: "1.0"
        # HTTPS-only networking → exempt; skips the TestFlight compliance
        # prompt on every build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APPICON_NAME)
        # The Icon Composer glass icons (AppIcon.icon / AppIconDev.icon) are
        # selected by the same APPICON_NAME; the raster .appiconsets of the
        # same names stay in as the back-deploy fallback and need this to be
        # included alongside the .icon.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K74Q6RKFBY
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTracker$(BUNDLE_ID_SUFFIX)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: WorkoutWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UI
          - Visual
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutTracker.app/WorkoutTracker"

  WorkoutTrackerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        includes:
          - Visual/**
          - Support/**
    dependencies:
      - target: WorkoutTracker
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerSnapshotTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutTracker.app/WorkoutTracker"

  WorkoutTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: WorkoutTracker

  WorkoutWidgets:
    type: app-extension
    platform: iOS
    sources: [WorkoutWidgets, WorkoutShared]
    info:
      path: WorkoutWidgets/Info.plist
      properties:
        # Required by App Store validation (ITMS-90360); flavor-aware so dev
        # builds read "WT Dev Widgets".
        CFBundleDisplayName: $(APP_DISPLAY_NAME) Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K74Q6RKFBY
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTracker$(BUNDLE_ID_SUFFIX).Widgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": true
        "-UITEST_SESSION": true
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
        - WorkoutTrackerSnapshotTests
        - WorkoutTrackerUITests

  Copy of WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": false
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
