name: WorkoutTracker
options:
  bundleIdPrefix: com.sunnypatel
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    majorVersion: 0.58.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.2

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources: [WorkoutTracker, WorkoutShared]
    info:
      path: WorkoutTracker/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GID_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K74Q6RKFBY
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTracker
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        VERSIONING_SYSTEM: apple-generic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - target: WorkoutWidgets
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UI
          - Visual
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutTracker.app/WorkoutTracker"

  WorkoutTrackerSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        includes:
          - Visual/**
          - Support/**
    dependencies:
      - target: WorkoutTracker
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerSnapshotTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutTracker.app/WorkoutTracker"

  WorkoutTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: WorkoutTracker

  WorkoutWidgets:
    type: app-extension
    platform: iOS
    sources: [WorkoutWidgets, WorkoutShared]
    info:
      path: WorkoutWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K74Q6RKFBY
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTracker.Widgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        VERSIONING_SYSTEM: apple-generic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution

schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": true
        "-UITEST_SESSION": true
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
        - WorkoutTrackerSnapshotTests
        - WorkoutTrackerUITests

  Copy of WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": false
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
