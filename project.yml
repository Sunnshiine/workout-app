name: WorkoutTracker
options:
  bundleIdPrefix: com.sunnypatel
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    majorVersion: 0.58.0

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources: [WorkoutTracker]
    info:
      path: WorkoutTracker/Info.plist
      properties:
        GIDClientID: $(GID_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        UILaunchStoryboardName: LaunchScreen
    settings:
      base:
        CODE_SIGN_IDENTITY: iPhone Developer
        DEVELOPMENT_TEAM: K74Q6RKFBY
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTracker
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins

  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UI
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerTests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WorkoutTracker.app/WorkoutTracker"

  WorkoutTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnypatel.WorkoutTrackerUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: WorkoutTracker

schemes:
  WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": true
        "-UITEST_SESSION": true
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
        - WorkoutTrackerUITests

  Copy of WorkoutTracker:
    build:
      targets:
        WorkoutTracker: all
    run:
      config: Debug
      commandLineArguments:
        "-UITEST_FIXTURE": false
    test:
      config: Debug
      targets:
        - WorkoutTrackerTests
