# SwiftLint configuration
#
# Two runners, one config. The Xcode app target runs SwiftLint through the SwiftLintPlugins build
# tool plugin, so `App` and `Sources/WorkoutTracker` are linted on every app build. `scripts/lint.sh`
# runs the same pinned binary over everything `included:` names, with no build, and CI calls it.
# Before that script existed the plugin was the only runner, so `Sources/WorkoutCLI` and `Tests`
# were linted nowhere (issue #607).
#
# `Tests` carries its own nested `Tests/.swiftlint.yml` that switches off three rules a test body
# reads better without. SwiftLint merges it into this file; nothing else overrides anything here.

disabled_rules:
  - trailing_whitespace
  - todo
  - file_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_opening_braces
  - private_swiftui_state
  - unhandled_throwing_task

included:
  - App
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - "**/.build"
  - "**/Generated"

custom_rules:
  # scripts/tests/swiftlint-custom-rules.test.sh lints a fixture tree under this file and fails CI
  # when the violations stop matching its table or one is not an error (#652).
  #
  # The type choke point (token sheet §4, ADR-0014, ledger §1.7). Every text style is one row of
  # Theme's type role table; no view constructs a font. This bans the three escape routes —
  # Font.custom(…), .system(size:…), and the shorthand system text styles (.font(.headline) …) —
  # so type cannot drift per-view and adopting Dynamic Type later stays a one-file diff. The
  # glyphFont(…) hatch is retired (it minted arbitrary system fonts through the seam).
  #
  # The pre-Greenhouse screens still use the shorthand; each is grandfathered below until its
  # composition slice rebuilds it onto Theme.font(_:) and drops it from this list. Theme.swift is
  # the sanctioned home of the role table (its off-device fallback uses Font.custom).
  font_construction_via_theme:
    name: "Font construction via the Theme seam"
    message: >
      Construct fonts only through the single type role table on the Theme seam (Theme.font(_:)).
      Font.custom(…), .system(size:…) and the shorthand system text styles (.font(.headline) …)
      are banned outside Theme.swift so type cannot drift per-view and Dynamic Type stays a
      one-file diff (ADR-0014, token sheet §4).
    regex: '(Font\.custom\(|\.system\(size|\.font\(\s*\.(largeTitle|title|title2|title3|headline|subheadline|body|callout|footnote|caption|caption2)\b)'
    included: '.*/(App|Sources/WorkoutTracker)/.*'
    # The Greenhouse contract slice (PRD #497 slice 9) retired every grandfathered exception: each
    # composition slice migrated its view onto Theme.font(_:), and the remaining chrome/dev surfaces
    # were re-voiced through the same seam. Theme.swift stays the one sanctioned home of the role
    # table (its off-device fallback uses Font.custom).
    excluded:
      - '.*/Theme\.swift'
    severity: error

  # Uppercase microlabels are editorial scaffolding the sunlit-ledger register carried; Greenhouse
  # strips them (DESIGN.md §4, token sheet §4 "do not carry"). Field labels read in sentence/label
  # case through the type roles — no view uppercases a microlabel via `.textCase(.uppercase)` or a
  # `.uppercased()` display string.
  no_uppercase_microlabels:
    name: "No uppercase microlabels"
    message: >
      Greenhouse strips the uppercase microlabel (DESIGN.md §4, token sheet §4 — "do not carry").
      Render field/section labels in their natural case through Theme.font(_:); do not apply
      .textCase(.uppercase) or .uppercased() to displayed text.
    regex: '(\.textCase\(\s*\.uppercase\s*\)|\.uppercased\(\))'
    included: '.*/App/Views/.*'
    severity: error

  # The vacuous-test trap (issues #608, #636). `message:` below is the reason a reader gets at the
  # violation; this is the reason the pattern has the shape it has.
  #
  # The predicate is "every assertion is inside the guard", not "the body opens with one". A test can
  # lead with a comment or a binding and still assert nothing, so the `#if` may follow comment and
  # `let`/`var` lines. Its `#endif` must then reach the closing brace: a test that also asserts
  # outside the guard runs for real on both platforms, and moving its guard up would delete
  # assertions that belong on iOS.
  #
  # An `#if`/`#else` pair in a test body matches too, as it did under the #608 rule. That is #632's
  # call and it stands: two branches want two guarded declarations, not one test that means
  # different things per platform. `message:` says so, because the plain advice would be wrong there.
  platform_guard_on_test_declaration:
    name: "Platform guard on the test declaration"
    message: >
      Move this `#if` around the `@Test` declaration. A test whose assertions all sit inside the
      guard compiles to an empty body on the other platform and passes there having asserted
      nothing (issue #608); guarding the declaration drops the test there instead, so the reported
      count is the number that ran. An `#if`/`#else` pair lands here too: give each branch its own
      guarded declaration, rather than one test that means different things per platform.
    regex: '@Test\b(?:[^\n{}]*\n){0,12}?[^\n{}]*\{[ \t]*\n(?:[ \t]*(?://[^\n]*)?\n|[ \t]*(?:let|var)\b[^\n{}]*\n)*[ \t]*#if\b(?:(?![ \t]*@Test\b)[^\n]*\n)*?[ \t]*#endif[ \t]*\n(?:[ \t]*(?://[^\n]*)?\n)*[ \t]*\}'
    severity: error

  unstructured_task_is_held:
    name: "Unstructured Tasks are held"
    message: >
      Hold the Task (assign it to a property or return it) so its owner can cancel or await it, or
      await structured work instead. A dropped Task { } raced shared sync state in #585 and #514.
    regex: '^[ \t]*Task(\.detached)?[ \t]*(\([^)\n]*\))?[ \t]*\{'
    included:
      - '.*/(App|Sources)/.*'
      - '.*/Tests/.*'
    excluded:
      - '.*/App/Views/.*'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  optional_bool_needs_a_nil_answer:
    name: "Optional Bool compared to a literal"
    message: >
      nil is a third answer here. Unwrap and decide it (guard let, or ?? with the answer nil means
      here) so a missing value cannot read as "not busy" or "not pending" (CODING_STANDARDS.md
      §optionals, #582).
    regex: '(\?\.[A-Za-z_][\w.]*(\([^)]*\))?|\(try\?[^\n]*\)|\.(map|flatMap)\([^\n]*\))\s*[!=]=\s*(true|false)\b'
    included: '.*/(App|Sources)/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error

  fixture_dates_are_literal:
    name: "Fixture and test dates are literal"
    message: >
      Derive this instant from the fixture's reference date (a literal, or an offset from one) so
      the value does not depend on when the test runs (#597).
    regex: '(\bDate\(\)|\bDate\.now\b|\bDate\(timeIntervalSinceNow:|\bTimeZone\.current\b|\bCalendar\.current\b|\.autoupdatingCurrent\b)'
    included:
      - '.*/Sources/WorkoutTracker/Fixtures/.*'
      - '.*/Tests/.*'
    excluded:
      - '.*/Tests/UI/.*'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

  polling_loops_are_bounded:
    name: "Polling loops are bounded"
    message: >
      Check a condition, bound the loop, and record a failure when it runs out (for _ in 0..<10_000
      { if done { return }; await Task.yield() }; Issue.record(…)). An unbounded yield loop hangs CI
      instead of failing, and a counted one flakes.
    regex: '(\bwhile\b[^\n{]*|\brepeat\s*|\bfor\s+_\s+in\b[^\n{]*)\{\s*(try\s+)?await\s+Task\.yield\(\)\s*\}'
    included: '.*/Tests/.*'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    severity: error

identifier_name:
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 140
  error: 200

type_name:
  # `ID` is the name Swift itself gives an identity type (`Identifiable.ID`). Padding it to three
  # characters to satisfy a minimum would rename the one thing every reader already recognizes.
  excluded:
    - ID

type_body_length:
  warning: 300
  error: 500
