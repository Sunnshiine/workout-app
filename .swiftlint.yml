# SwiftLint configuration
# Runs automatically via SwiftLintPlugins build tool plugin

disabled_rules:
  - trailing_whitespace
  - todo
  - file_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_opening_braces
  - private_swiftui_state
  - unhandled_throwing_task

included:
  - WorkoutTracker
  - Tests

excluded:
  - .build
  - DerivedData
  - "**/.build"
  - "**/Generated"

custom_rules:
  font_construction_via_theme:
    name: "Font construction via the Theme seam"
    message: >
      Construct fonts only through the single type role table on the Theme seam
      (Theme.font(_:) for text roles, Theme.glyphFont(...) for decorative glyphs).
      Font.custom / .system(size:) is banned outside Theme.swift so type cannot
      drift per-view and Dynamic Type stays a one-file diff (ADR-0014, token sheet §4).
    regex: '(Font\.custom\(|\.system\(size)'
    included: '.*/WorkoutTracker/.*'
    excluded: '.*/Theme\.swift'
    severity: error

identifier_name:
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 300
  error: 500
