name: CI

# PR gate: `swift test` covers the SPM library (unit + component tests);
# `app-build` compile-checks the full app target including Views/, which the
# library target excludes; `visual-tests` runs the ADR-0007 Visual Regression
# suite on the pinned simulator — with `.snapshots(record: .never)`, a missing
# or drifted Visual Baseline fails the job. All need macOS; app-build and
# visual-tests additionally need Xcode 27 (Liquid Glass APIs, ADR-0004),
# which is the xcode-27 default.
#
# Note: pushes made with the plain GITHUB_TOKEN do not trigger this workflow
# (GitHub suppresses token-driven events). Agent workflows check out with
# AGENT_PAT, so their pushes do trigger it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run unit + component tests
        run: swift test

  app-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Secrets.xcconfig is git-ignored but referenced by the xcodeproj; the
      # template's placeholder values are enough for compile-checking the app
      # target (not for running against live Google Sheets).
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Compile-check the app target (incl. Views)
        run: |
          xcodebuild build -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

  visual-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      # A committed `record: .all` (suite- or test-level) makes every snapshot
      # test write its baseline instead of comparing — the gate below would go
      # green while checking nothing. Recording flips are working state only
      # (VISUAL_LOOP.md); they must never land.
      - name: Refuse committed record mode (gate must stay armed)
        run: |
          if grep -rnF "record: .all" Tests/Visual/; then
            echo "::error::Committed .snapshots(record: .all) found — this disarms the Visual Regression gate. Revert to record: .never."
            exit 1
          fi
      # The pinned baseline device (ADR-0007): iPhone 17 Pro, on iOS 27.0 —
      # the runtime the xcode-27 image preinstalls (it ships no 26.x, so the
      # pin must move with the runner image; an unavailable pin fails loudly
      # with exit code 70). The committed baselines were recorded on this
      # exact runner/runtime pair (issue #479); xcodebuild boots the
      # simulator itself. TEST_RUNNER_SNAPSHOT_ARTIFACTS lands
      # swift-snapshot-testing's failure diffs in a known folder so the
      # artifact upload below can show *why* the gate went red.
      - name: Run Visual Regression tests (ADR-0007 gate)
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerSnapshotTests \
            -resultBundlePath VisualTests.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_SNAPSHOT_ARTIFACTS="$PWD/snapshot-diffs"
      - name: Upload Visual Baseline diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: |
            snapshot-diffs
            VisualTests.xcresult
          if-no-files-found: ignore
