name: CI

# Note: pushes made with the plain GITHUB_TOKEN do not trigger this workflow
# (GitHub suppresses token-driven events). Agent workflows check out with
# AGENT_PAT, so their pushes do trigger it.

on:
  pull_request:
    # A retarget, by hand or by GitHub when a stacked PR's parent merges, fires only edited. A title
    # or body edit's jobs skip, and GitHub lists a skipped job under its name expression unevaluated,
    # so each job's name expression keeps those checks off the real check names in gh pr checks.
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - ".sandcastle/**"
      - "scripts/prototype-capture/**"
      - "scripts/tests/**"
      - "scripts/contact-sheet.*"
      - "scripts/lint-workflow-ifs.sh"
      - "scripts/lint-skill-links.sh"
      - "scripts/ci-visual-diffs.sh"
      - ".github/actions/**"
      - ".github/workflows/agent-*.yml"
      - ".github/workflows/verify-tools.yml"
      - ".github/workflows/script-tests.yml"
      - ".github/workflows/workflow-lint.yml"
      - ".github/workflows/skill-links.yml"
      - ".github/workflows/architecture-review.yml"
      - ".github/workflows/asc-signing-inventory.yml"
      - ".github/workflows/testflight-*.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "skills-lock.json"
      - ".mcp.json"
      - ".gitignore"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui-suite:
        description: Also run WorkoutTrackerUITests after the hosted suite
        type: boolean
        default: false

# A title or body edit gets a group of its own, so it never cancels one. A push to main is keyed on
# its commit, so a merge that lands mid-run never cancels the run verifying the merge before it.
concurrency:
  group: ci-${{ ((github.event_name == 'workflow_dispatch' || (github.event.action == 'edited' && !github.event.changes.base)) && github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # SwiftLint over every tree `.swiftlint.yml` names. The app target lints itself through the
  # SwiftLintPlugins build tool plugin, so before this job `WorkoutCLI` and `Tests` were in the
  # config's `included:` list and linted nowhere (issue #607). Nothing here builds the app, so it
  # finishes in about a minute alongside the two test jobs rather than extending them.
  lint:
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'lint (edit, base unchanged)' || 'lint' }}
    # SwiftLint needs no Xcode and no simulator. This label is the repo's runner pool, not a
    # toolchain requirement.
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      # Depth 2 keeps the pull request merge commit's first parent, the base the diff below needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # actions/checkout#919: a retarget's run may still get the merge commit built on the old base.
      - name: Refuse a merge commit built on the base this pull request left
        if: github.event.action == 'edited'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          parent=$(git rev-parse HEAD^1)
          if [ "$parent" != "$BASE_SHA" ]; then
            echo "::error::The merge commit sits on ${parent:0:7}, not the new base ${BASE_SHA:0:7}. Push to the branch to rerun."
            exit 1
          fi
      # The version comes from the same Package.resolved the Xcode plugin resolves against, so the
      # cache key moves when the pin moves and never serves a stale binary.
      - name: Read the pinned SwiftLint version
        id: swiftlint
        run: echo "version=$(scripts/lint.sh --print-version)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned SwiftLint binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftlint
          key: swiftlint-${{ runner.os }}-${{ steps.swiftlint.outputs.version }}
      - name: Lint, check doc spans and workflow guards, and swift-format the changed Swift
        env:
          SWIFTLINT_CACHE_DIR: ${{ runner.temp }}/swiftlint
          LINT_FORMAT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: scripts/lint.sh

  swift-tests:
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'swift-tests (edit, base unchanged)' || 'swift-tests' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache the CRAP scorer build
        uses: actions/cache@v4
        with:
          path: tools/crap/.build
          key: crap-tool-${{ runner.os }}-${{ hashFiles('tools/crap/Package.resolved', 'tools/crap/Sources/**') }}
          restore-keys: crap-tool-${{ runner.os }}-
      - name: Read the Xcode build number
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swift-tests/SourcePackages
          key: swift-tests-spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved') }}
      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift-tests/CompilationCache
          key: swift-tests-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: swift-tests-cas-${{ steps.xcode.outputs.build }}-
      - name: Test the CRAP scorer
        run: swift test --package-path tools/crap
      - name: Run unit + component tests and the CRAP gate (ADR-0016)
        run: scripts/crap.sh gate --xcodebuild "$RUNNER_TEMP/swift-tests"
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift-tests/CompilationCache
          key: swift-tests-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}

  visual-tests:
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'visual-tests (edit, base unchanged)' || 'visual-tests' }}
    runs-on: xcode-27
    timeout-minutes: 45
    # Every committed baseline was recorded on this exact pair (ADR-0007, issue #479).
    # Renders differ across machines and runtimes at the suite's exact precision, so treat
    # a change to either value as a re-record of every baseline.
    env:
      BASELINE_DEVICE: iPhone 17 Pro
      BASELINE_RUNTIME: "27.0"
    steps:
      - uses: actions/checkout@v4
      # Creating the device is enough. xcodebuild boots it itself for the test step below.
      - name: Ensure the pinned baseline simulator exists
        run: scripts/ensure-simulator.sh "$BASELINE_DEVICE" "$BASELINE_RUNTIME"
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      # A committed `record: .all` (suite- or test-level) makes every snapshot
      # test write its baseline instead of comparing — the gate below would go
      # green while checking nothing. Recording flips are working state only
      # (VISUAL_LOOP.md); they must never land.
      - name: Refuse committed record mode (gate must stay armed)
        run: |
          status=0
          grep -rnF "record: .all" Tests/Visual/ || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Committed .snapshots(record: .all) found — this disarms the Visual Regression gate. Revert to record: .never."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep could not search Tests/Visual/ (exit $status), so this guard checked nothing."
            exit 1
          fi
      - name: Read the Xcode build number
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      # Compilation cache keys embed absolute paths, and Xcode's prefix mapping does not remove
      # them for this project, so DerivedData, the package checkouts, and the cache stay pinned
      # under runner.temp. Moving any of them turns every cached compile into a miss.
      - name: Restore package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('WorkoutTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: cas-${{ steps.xcode.outputs.build }}-
      - name: Run Visual Regression tests (ADR-0007 gate)
        id: visual
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,name=$BASELINE_DEVICE,OS=$BASELINE_RUNTIME" \
            -only-testing:WorkoutTrackerSnapshotTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath VisualTests.xcresult \
            -collect-test-diagnostics never \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache"
      # WorkoutTrackerTests hosted in the app reaches what `swift test` on macOS cannot: UIKit
      # font registration, Live Activity content state, and the Google auth scopes (#606). The
      # two runs cover deliberately different sets (#592); do not reconcile them. Every flag
      # matches the gate above so xcodebuild reuses that DerivedData instead of rebuilding, and
      # the step runs whenever that gate ran so one CI run reports both.
      #
      # `!cancelled()` is load-bearing. GitHub prepends an implicit `success() &&` to any `if:`
      # holding no status check function, so without it this condition reads as always-true on a
      # green job and always-false on a red one, and a baseline mismatch silently skips the
      # hosted suite. Run 35515594647 recorded that skip before this line was fixed.
      - name: Run the hosted unit and component suite (WorkoutTrackerTests)
        id: hosted
        if: ${{ !cancelled() && (steps.visual.conclusion == 'success' || steps.visual.conclusion == 'failure') }}
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,name=$BASELINE_DEVICE,OS=$BASELINE_RUNTIME" \
            -only-testing:WorkoutTrackerTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath HostedTests.xcresult \
            -collect-test-diagnostics never \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache"
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
      # Opt-in, not per PR: on unchanged code it goes red about half the time on
      # testActiveSetLogButtonSubmitsOnFirstCenterTapWhileWeightFieldIsFocused (#518, #662).
      - name: Run the UI suite (WorkoutTrackerUITests)
        id: ui
        if: ${{ !cancelled() && inputs.ui-suite && (steps.visual.conclusion == 'success' || steps.visual.conclusion == 'failure') }}
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "platform=iOS Simulator,name=$BASELINE_DEVICE,OS=$BASELINE_RUNTIME" \
            -only-testing:WorkoutTrackerUITests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath UITests.xcresult \
            -collect-test-diagnostics never \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache"
      - name: Upload Visual Baseline diffs
        if: failure() && steps.visual.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: VisualTests.xcresult
          if-no-files-found: ignore
      - name: Upload hosted test results
        if: failure() && steps.hosted.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-test-results
          path: HostedTests.xcresult
          if-no-files-found: ignore
      - name: Upload UI test results
        if: failure() && steps.ui.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITests.xcresult
          if-no-files-found: ignore
