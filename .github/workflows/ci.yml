name: CI

# PR gate: `scripts/crap.sh gate` runs the package tests with coverage and the CRAP gate (ADR-0016);
# `visual-tests` builds every scheme target (the app including Views/, which the
# library target excludes, the widgets, and the test bundles) and runs the
# ADR-0007 Visual Regression suite on the pinned simulator — with
# `.snapshots(record: .never)`, a missing or drifted Visual Baseline fails the
# job. Both need macOS; visual-tests additionally needs Xcode 27 (Liquid Glass
# APIs, ADR-0004), which is the xcode-27 default.
#
# Note: pushes made with the plain GITHUB_TOKEN do not trigger this workflow
# (GitHub suppresses token-driven events). Agent workflows check out with
# AGENT_PAT, so their pushes do trigger it.

on:
  pull_request:
    branches: [main]
    # A PR whose every changed file is below skips CI: nothing here reaches the app build or
    # the package tests. The list names what CI ignores, not what it reads, so a new path
    # runs CI by default. Pushes to main always run.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ralph/**"
      - ".agents/**"
      - ".claude/**"
      - ".sandcastle/**"
      - "scripts/prototype-capture/**"
      - ".github/actions/**"
      - ".github/workflows/agent-*.yml"
      - ".github/workflows/architecture-review.yml"
      - ".github/workflows/asc-signing-inventory.yml"
      - ".github/workflows/testflight-*.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "pyproject.toml"
      - ".python-version"
      - "skills-lock.json"
      - ".mcp.json"
      - ".gitignore"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # swift-syntax is the scorer's only heavy dependency; caching its build keeps the job near
      # the cost of `swift test` alone.
      - name: Cache the CRAP scorer build
        uses: actions/cache@v4
        with:
          path: tools/crap/.build
          key: crap-tool-${{ runner.os }}-${{ hashFiles('tools/crap/Package.resolved', 'tools/crap/Sources/**') }}
          restore-keys: crap-tool-${{ runner.os }}-
      - name: Read the Xcode build number
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      # SwiftPM has no compilation cache, so the tests build through xcodebuild, whose cache
      # replays every compile from the CAS. Hits need the same absolute paths on every run,
      # which the checkout and runner.temp provide.
      - name: Cache the Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swift-tests/SourcePackages
          key: swift-tests-spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved') }}
      # Pull requests restore main's cache; only pushes to main save one.
      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift-tests/CompilationCache
          key: swift-tests-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: swift-tests-cas-${{ steps.xcode.outputs.build }}-
      - name: Run unit + component tests and the CRAP gate (ADR-0016)
        run: scripts/crap.sh gate --xcodebuild "$RUNNER_TEMP/swift-tests"
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift-tests/CompilationCache
          key: swift-tests-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}

  visual-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Secrets.xcconfig is git-ignored but referenced by the xcodeproj; the
      # template's placeholder values are enough to build (not to run against
      # live Google Sheets).
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      # A committed `record: .all` (suite- or test-level) makes every snapshot
      # test write its baseline instead of comparing — the gate below would go
      # green while checking nothing. Recording flips are working state only
      # (VISUAL_LOOP.md); they must never land.
      - name: Refuse committed record mode (gate must stay armed)
        run: |
          if grep -rnF "record: .all" Tests/Visual/; then
            echo "::error::Committed .snapshots(record: .all) found — this disarms the Visual Regression gate. Revert to record: .never."
            exit 1
          fi
      - name: Read the Xcode build number
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      # Pinned paths: compilation cache keys include absolute paths, so DerivedData,
      # the package checkouts, and the cache itself must sit at the same place on
      # every runner for a restored cache to hit.
      - name: Restore package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('WorkoutTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Pull requests restore main's cache; only pushes to main save one, so PR runs skip the
      # upload and do not crowd the repository's cache quota.
      - name: Restore the compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: cas-${{ steps.xcode.outputs.build }}-
      # The pinned baseline device (ADR-0007): iPhone 17 Pro, on iOS 27.0 —
      # the runtime the xcode-27 image preinstalls (it ships no 26.x, so the
      # pin must move with the runner image; an unavailable pin fails loudly
      # with exit code 70). The committed baselines were recorded on this
      # exact runner/runtime pair (issue #479); xcodebuild boots the
      # simulator itself. TEST_RUNNER_SNAPSHOT_ARTIFACTS lands
      # swift-snapshot-testing's failure diffs in a known folder so the
      # artifact upload below can show *why* the gate went red.
      - name: Run Visual Regression tests (ADR-0007 gate)
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerSnapshotTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath VisualTests.xcresult \
            -collect-test-diagnostics never \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache" \
            TEST_RUNNER_SNAPSHOT_ARTIFACTS="$PWD/snapshot-diffs"
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
      - name: Upload Visual Baseline diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: |
            snapshot-diffs
            VisualTests.xcresult
          if-no-files-found: ignore
