# Temporary spike for issue #483: prove that after converting the Tests/
# groups to fileSystemSynchronizedGroups, `xcodebuild test` runs the full
# WorkoutTrackerTests suite (including the 15 files that had drifted out of
# every Xcode target) and the ADR-0007 Visual gate still builds and passes
# with the baseline PNGs excluded from the bundle's Resources.
# Retire this workflow once the verdict is recorded on the ticket.

name: issue-483 target-sync spike

on:
  workflow_dispatch:
  push:
    branches: [claude/wayfinder-issue-468-dullov]

jobs:
  xcodebuild-full-suite:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Run WorkoutTrackerTests under xcodebuild
        shell: bash
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-tests.log
      - name: Verify the 15 resurrected files actually ran
        shell: bash
        run: |
          missing=0
          for t in \
            iconManifestsContainNoExplicitNulls \
            lastPerformedEntryRoundTripsThroughTheCanonicalOccurrence \
            backoffRetriesTransientFailuresThenReturnsFetchedSnapshot \
            buildIdentityReadsStampedKeysFromInfoDictionary \
            canonicalizeStripsCadenceLowercasesAndCollapses \
            lookupForDerivesBaseNameByCadenceStripping \
            setLogListCollapsesLoneEmptyCellToEmptyList \
            restModuleSurfacesNoHapticsOnTheFirstTick \
            exerciseSetPendingAtom \
            restIntervalDerivesEndFromStartAndDuration \
            lastPerformedLookupFindsExactCadenceMatch \
            orderedSetsSortsByExerciseOrderThenSetIndex \
            historyQueryReturnsMovementMatchesNewestFirst \
            historySheetTitleAndSubtitleUseMovementNameAndCap \
            fillProgressSurfacesTabAndCounts \
          ; do
            grep -q "$t" xcodebuild-tests.log || { echo "MISSING: $t"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "All 15 resurrected test files ran."
          exit "$missing"

  visual-gate:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Run Visual Regression tests (ADR-0007 gate)
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerSnapshotTests \
            -derivedDataPath DerivedData \
            -resultBundlePath VisualTests.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_SNAPSHOT_ARTIFACTS="$PWD/snapshot-diffs"
      - name: Verify no baseline PNGs were copied into the test bundle
        shell: bash
        run: |
          bundle=$(find DerivedData/Build/Products -name "WorkoutTrackerSnapshotTests.xctest" | head -1)
          echo "bundle: $bundle"
          # GoogleSignIn's own resource bundle legitimately ships google*.png
          # icons; only ADR-0007 baselines are the smell being tested for.
          pngs=$(find "$bundle" -name "*MatchesVisualBaseline*.png" -o -path "*__Snapshots__*" | tee /dev/stderr | wc -l)
          [ "$pngs" -eq 0 ] && echo "Resources phase is clean of baselines." || exit 1
      - name: Upload Visual Baseline diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: |
            snapshot-diffs
            VisualTests.xcresult
          if-no-files-found: ignore
