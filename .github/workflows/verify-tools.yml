name: Verify tools

on:
  pull_request:
    paths:
      - ".agents/skills/verify/**"
      - ".claude/skills/verify"
      - "scripts/contact-sheet.swift"
      - "scripts/bootstrap-xcode-worktree.sh"
      - "scripts/ensure-simulator.sh"
      - "scripts/sim-lock.sh"
      - "scripts/test-sim.sh"
      - "scripts/test-log-summary.awk"
      - "scripts/test-log-summary.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/verify-tools.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/verify/**"
      - ".claude/skills/verify"
      - "scripts/contact-sheet.swift"
      - "scripts/bootstrap-xcode-worktree.sh"
      - "scripts/ensure-simulator.sh"
      - "scripts/sim-lock.sh"
      - "scripts/test-sim.sh"
      - "scripts/test-log-summary.awk"
      - "scripts/test-log-summary.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/verify-tools.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: verify-tools-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      # The Azure apt mirror twice ran so slowly that the ffmpeg install outlasted the job's 10
      # minutes (runs 40406050512, 40409651039). Its .deb files are cached per runner image, so a
      # hit installs them with no mirror at all. Only a new image downloads, once.
      - id: image
        run: echo "key=apt-ffmpeg-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: debs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.image.outputs.key }}
      - name: Install ffmpeg
        run: |
          if [ "${{ steps.debs.outputs.cache-hit }}" = true ]; then
            sudo apt-get install -y -q --no-install-recommends ~/apt-archives/*.deb
          else
            apt="-q -o Acquire::http::Timeout=30 -o Acquire::Retries=3"
            mkdir -p ~/apt-archives/partial
            sudo apt-get update $apt
            sudo apt-get install -y --no-install-recommends $apt -o Dir::Cache::Archives="$HOME/apt-archives" \
              -o APT::Keep-Downloaded-Packages=true ffmpeg
            sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
            sudo chown -R "$USER" ~/apt-archives
          fi
      # The command .agents/skills/verify/SKILL.md documents. .python-version pins 3.9, what
      # /usr/bin/python3 is on a stock Xcode machine.
      - run: uv run --locked python -m unittest discover -s .agents/skills/verify/tests

  sheet:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The stock python3 with no packages, as verify.sh runs it in a shell without the .venv,
      # and the VerifySheet tests that only run on macOS.
      - name: The evidence tests on the stock python3
        run: python3 -m unittest discover -s .agents/skills/verify/tests -p 'test_evidence*.py'
