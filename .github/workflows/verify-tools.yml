name: Verify tools

on:
  pull_request:
    paths:
      - ".agents/skills/verify/**"
      - ".claude/skills/verify"
      - "scripts/contact-sheet.*"
      - "scripts/ensure-simulator.sh"
      - "scripts/flake-hunt.sh"
      - "scripts/sim-lock.sh"
      - "scripts/test-sim.sh"
      - "scripts/sim-keyboard.sh"
      - "scripts/snapshot-diffs.sh"
      - "scripts/test-log-summary.awk"
      - "scripts/tests/test-sim.test.sh"
      - "scripts/tests/sim-keyboard.test.sh"
      - "scripts/tests/snapshot-diffs.test.sh"
      - "scripts/tests/flake-hunt.test.sh"
      - "scripts/wait-load.sh"
      - "scripts/tests/host-admission.test.sh"
      - ".github/workflows/verify-tools.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/verify/**"
      - ".claude/skills/verify"
      - "scripts/contact-sheet.*"
      - "scripts/ensure-simulator.sh"
      - "scripts/flake-hunt.sh"
      - "scripts/sim-lock.sh"
      - "scripts/test-sim.sh"
      - "scripts/sim-keyboard.sh"
      - "scripts/snapshot-diffs.sh"
      - "scripts/test-log-summary.awk"
      - "scripts/tests/test-sim.test.sh"
      - "scripts/tests/sim-keyboard.test.sh"
      - "scripts/tests/snapshot-diffs.test.sh"
      - "scripts/tests/flake-hunt.test.sh"
      - "scripts/wait-load.sh"
      - "scripts/tests/host-admission.test.sh"
      - ".github/workflows/verify-tools.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: verify-tools-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 3.9 is what /usr/bin/python3 is on a stock Xcode machine, and the skill has to run there.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 .agents/skills/verify/tests/test_evidence.py
      - uses: astral-sh/setup-uv@v10.3.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv run .agents/skills/verify/tests/test_motion.py

  sheet:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: test_evidence.py, with the VerifySheet tests that only run on macOS
        run: python3 .agents/skills/verify/tests/test_evidence.py
