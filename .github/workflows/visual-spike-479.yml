name: Visual re-record + determinism spike (issue 479)

# Throwaway spike for wayfinder ticket #479 — deleted once the re-recorded
# baselines are committed and the verdict is recorded on the ticket.
#
#   record-main:      this branch — records the committed main-suite Visual
#                     Baselines on the xcode-27 runner's iOS 27.0 runtime and
#                     re-proves ADR-0007 determinism (byte-compare across a
#                     simulator reboot AND a clean rebuild). Run 1 is uploaded
#                     for committing as the new ground truth. Also lists the
#                     image's simulator runtimes (iOS 26.x co-existence check
#                     handed over from #478).
#   spike-greenhouse: PR #467's branch — re-proves determinism of the
#                     Greenhouse surfaces (paper washes, bundled Fraunces /
#                     Source Sans 3) on iOS 27.0, where the render risk lives.
#                     Recordings are proof only, not committed — #467 records
#                     its own baselines when it re-drives. Its Xcode test
#                     targets are broken in ways the pipeline never saw
#                     (stale PNG refs, ManualRestClock missing), so the job
#                     patches the pbxproj in-place, same as the #471 spike.

on:
  workflow_dispatch:
  push:
    branches: [claude/wayfinder-479-da20d4]

env:
  DEST: platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0

jobs:
  record-main:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEST: platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Runtime inventory (iOS 26.x co-existence check, from #478)
        run: |
          echo "## record-main verdicts" >> "$GITHUB_STEP_SUMMARY"
          echo '### Simulator runtimes on the xcode-27 image' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl list runtimes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl list runtimes > /tmp/runtimes.txt

      - name: Flip suite trait to record (.never -> .all)
        run: sed -i '' 's/\.snapshots(record: \.never)/.snapshots(record: .all)/' Tests/Visual/*.swift
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      - name: 1 — Record run 1 (canonical candidate)
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            CODE_SIGNING_ALLOWED=NO
      - name: 1 — Stash run 1, shutdown simulator
        run: |
          count=$(find Tests/Visual/__Snapshots__ -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "1. Record run 1 captured $count PNGs." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ]
          cp -R Tests/Visual/__Snapshots__ /tmp/run1
          xcrun simctl shutdown all || true

      - name: 2 — Record run 2 (fresh simulator boot)
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            CODE_SIGNING_ALLOWED=NO
      - name: 2 — Stash run 2, clean build products, shutdown simulator
        run: |
          cp -R Tests/Visual/__Snapshots__ /tmp/run2
          rm -rf ~/Library/Developer/Xcode/DerivedData
          xcrun simctl shutdown all || true

      - name: 3 — Clean rebuild
        run: |
          xcodebuild build-for-testing -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: 3 — Record run 3 (clean build + fresh boot)
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            CODE_SIGNING_ALLOWED=NO
      - name: 3 — Determinism verdict (byte-compare 1v2 and 1v3)
        run: |
          cp -R Tests/Visual/__Snapshots__ /tmp/run3
          ok=true
          for pair in "run1 run2" "run1 run3"; do
            set -- $pair
            if diff -qr /tmp/$1 /tmp/$2 > /tmp/diff-$1-$2.txt 2>&1; then
              echo "DETERMINISTIC $1 vs $2: byte-identical." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              ok=false
              echo "DIFFERS $1 vs $2 (known animation flakes: moveOnCelebrationView, seededSessionView — anything else is new):" | tee -a "$GITHUB_STEP_SUMMARY"
              cat /tmp/diff-$1-$2.txt | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          $ok && echo "3. FULL VERDICT: main suite byte-deterministic on iOS 27.0 across reboot and clean rebuild." | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-suite-recordings-ios27
          path: |
            /tmp/run1
            /tmp/run2
            /tmp/run3
            /tmp/diff-run1-run2.txt
            /tmp/diff-run1-run3.txt
            /tmp/runtimes.txt
          if-no-files-found: ignore

  spike-greenhouse:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEST: platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prd-458-spec-greenhouse-screen-by-screen-build-implement-t
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Patch pbxproj (spike-only) — drop stale PNG refs, add ManualRestClock
        run: |
          sed -i '' '/MatchesVisualBaseline\.1\.png/d' WorkoutTracker.xcodeproj/project.pbxproj
          python3 - <<'PYEOF'
          import re
          path = 'WorkoutTracker.xcodeproj/project.pbxproj'
          p = open(path).read()
          fref, bfile = 'AAAA00000000000000000001', 'AAAA00000000000000000002'
          p = p.replace('/* Begin PBXBuildFile section */\n',
              '/* Begin PBXBuildFile section */\n\t\t%s /* ManualRestClock.swift in Sources */ = {isa = PBXBuildFile; fileRef = %s /* ManualRestClock.swift */; };\n' % (bfile, fref), 1)
          p = p.replace('/* Begin PBXFileReference section */\n',
              '/* Begin PBXFileReference section */\n\t\t%s /* ManualRestClock.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ManualRestClock.swift; sourceTree = "<group>"; };\n' % fref, 1)
          m = re.search(r'\n(\t+)(\w{24}) /\* SheetGridFixture.swift \*/,\n', p)
          p = p[:m.end()] + '%s%s /* ManualRestClock.swift */,\n' % (m.group(1), fref) + p[m.end():]
          m2 = re.search(r'E98FB6DCF05A192EB2634FA9 /\* Sources \*/ = \{\s*isa = PBXSourcesBuildPhase;.*?files = \(\n(\t+)', p, re.S)
          p = p[:m2.end()] + '%s /* ManualRestClock.swift in Sources */,\n%s' % (bfile, m2.group(1)) + p[m2.end():]
          open(path, 'w').write(p)
          print('patched')
          PYEOF
      - name: Flip suite trait to record (.never -> .all)
        run: sed -i '' 's/\.snapshots(record: \.never)/.snapshots(record: .all)/' Tests/Visual/*.swift
      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: 1 — Record run 1
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            CODE_SIGNING_ALLOWED=NO
      - name: 1 — Stash run 1, clean build products, shutdown simulator
        run: |
          echo "## spike-greenhouse verdicts" >> "$GITHUB_STEP_SUMMARY"
          count=$(find Tests/Visual/__Snapshots__ -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "1. Record run 1 captured $count Greenhouse PNGs on iOS 27.0." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ]
          cp -R Tests/Visual/__Snapshots__ /tmp/run1
          rm -rf ~/Library/Developer/Xcode/DerivedData
          xcrun simctl shutdown all || true
      - name: 2 — Clean rebuild
        run: |
          xcodebuild build-for-testing -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: 2 — Record run 2 (clean build + fresh boot)
        continue-on-error: true
        run: |
          xcodebuild test-without-building -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination "$DEST" -only-testing:WorkoutTrackerSnapshotTests \
            CODE_SIGNING_ALLOWED=NO
      - name: 2 — Determinism verdict (byte-compare run 1 vs run 2)
        run: |
          cp -R Tests/Visual/__Snapshots__ /tmp/run2
          if diff -qr /tmp/run1 /tmp/run2 > /tmp/diff-report.txt 2>&1; then
            echo "2. DETERMINISTIC on iOS 27.0: Greenhouse washes + Fraunces/Source Sans 3 byte-identical across clean rebuild + simulator reboot (exact precision holds)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "2. NON-DETERMINISTIC on iOS 27.0. Differing files:" | tee -a "$GITHUB_STEP_SUMMARY"
            cat /tmp/diff-report.txt | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-spike-recordings-ios27
          path: |
            /tmp/run1
            /tmp/run2
            /tmp/diff-report.txt
          if-no-files-found: ignore
