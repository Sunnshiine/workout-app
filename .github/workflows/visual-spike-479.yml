name: Visual gate verify (issue 479)

# Throwaway verification for wayfinder ticket #479 — deleted once the verdict
# is recorded on the ticket. Runs the exact ci.yml visual-tests job shape
# against the freshly committed iOS 27.0 baselines: with the suite trait at
# `.snapshots(record: .never)` this must go green, proving the re-recorded
# ground truth matches what the xcode-27 runner renders.

on:
  workflow_dispatch:
  push:
    branches: [claude/wayfinder-479-da20d4]

jobs:
  # One-shot: the onboardingViewCard test crashed during the full re-record
  # (missing SyncCoordinator environment object — iOS 27 resolves the lookup
  # eagerly), so its committed PNG is still the stale 26.4.1 recording. With
  # the fixture fixed, record just this test on iOS 27.0. Job is removed once
  # the PNG is committed.
  record-onboarding:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Flip suite trait to record (.never -> .all)
        run: |
          sed -i '' 's/\.snapshots(record: \.never)/.snapshots(record: .all)/' Tests/Visual/*.swift
      - name: Record onboardingViewCard on iOS 27.0
        continue-on-error: true
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerSnapshotTests/GlassBearingViewsVisualTests/onboardingViewCardMatchesVisualBaseline \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-recording-ios27
          path: Tests/Visual/__Snapshots__/GlassBearingViewsVisualTests/onboardingViewCardMatchesVisualBaseline.1.png
          if-no-files-found: error

  gate-verify:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - name: Run Visual Regression tests (ADR-0007 gate)
        run: |
          xcodebuild test -project WorkoutTracker.xcodeproj -scheme WorkoutTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -only-testing:WorkoutTrackerSnapshotTests \
            -resultBundlePath VisualTests.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_SNAPSHOT_ARTIFACTS="$PWD/snapshot-diffs"
      - name: Upload Visual Baseline diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-diffs
          path: |
            snapshot-diffs
            VisualTests.xcresult
          if-no-files-found: ignore
