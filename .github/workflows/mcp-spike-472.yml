name: Sighted-loop spike (issue 472)

# Throwaway verification for wayfinder ticket #472 — deleted once the verdict
# is recorded on the ticket. Two questions the docs can't answer (#480):
#
#   bare:   does the sandcastle-invoked claude (--dangerously-skip-permissions,
#           fresh untrusted checkout, NO user-scope approval) connect the
#           project .mcp.json servers at all?
#   seeded: with the user-scope approval step the agent workflows now use,
#           does the full headless loop work on this runner — boot, build+run
#           the fixture app, describe_ui/tap, screenshot, dark mode?
#
# Both reproduce the exact pipeline invocation path (.sandcastle/spike-472/).

on:
  workflow_dispatch:
  push:
    branches: [claude/wayfinder-issue-468-vyos16]

jobs:
  bare:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run bare probe (no MCP approval seeded)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: prompt-bare.md
        run: npx tsx .sandcastle/spike-472/spike.ts
      - name: Show result
        if: always()
        run: cat spike-result-bare.json || echo "NO RESULT FILE WRITTEN"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-472-bare
          path: spike-result-bare.json
          if-no-files-found: ignore

  seeded:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Create Secrets.xcconfig from template (build-only)
        run: cp Secrets.xcconfig.template Secrets.xcconfig
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Approve project MCP servers (user scope)
        run: |
          mkdir -p ~/.claude
          printf '%s\n' '{ "enabledMcpjsonServers": ["XcodeBuildMCP", "context7"] }' > ~/.claude/settings.json
      - name: Run seeded headless-loop spike
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_FILE: prompt-seeded.md
          XCODEBUILDMCP_HEADLESS_LAUNCH: "1"
          XCODEBUILDMCP_SENTRY_DISABLED: "true"
          XCODEBUILDMCP_PROJECT_PATH: ${{ github.workspace }}/WorkoutTracker.xcodeproj
          XCODEBUILDMCP_SCHEME: WorkoutTracker
          XCODEBUILDMCP_SIMULATOR_NAME: iPhone 17 Pro
        run: npx tsx .sandcastle/spike-472/spike.ts
      - name: Show result
        if: always()
        run: cat spike-result-seeded.json || echo "NO RESULT FILE WRITTEN"
      - name: Upload result + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-472-seeded
          path: |
            spike-result-seeded.json
            spike-artifacts
          if-no-files-found: ignore
