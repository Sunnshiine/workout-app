# Diagnostic: verify the CLAUDE_CODE_OAUTH_TOKEN secret without burning a full
# agent run. Dispatch manually (Actions → Agent Auth Check → Run workflow).
# Never prints the token; failures explain exactly what to fix.
name: Agent Auth Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check token shape
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing or empty. Set it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi
          trimmed=$(printf %s "$TOKEN" | tr -d '[:space:]')
          if [ "$TOKEN" != "$trimmed" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN contains whitespace or a newline. Re-set it, pasting only the token itself."
            exit 1
          fi
          case "$TOKEN" in
            sk-ant-oat*)
              echo "Token shape OK: OAuth token (sk-ant-oat…), length ${#TOKEN}."
              ;;
            sk-ant-api*)
              echo "::error::The secret holds an Anthropic API key (sk-ant-api…), not an OAuth token. Claude Code sends CLAUDE_CODE_OAUTH_TOKEN as a bearer token, so the API rejects it with '401 Invalid bearer token'. Run 'claude setup-token' and store the sk-ant-oat… token it prints."
              exit 1
              ;;
            *)
              echo "::error::Unrecognized token format (length ${#TOKEN}). Expected an OAuth token from 'claude setup-token' starting with sk-ant-oat. The value may be truncated or the wrong string entirely."
              exit 1
              ;;
          esac

      - name: Live auth probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          if claude -p "Reply with exactly: OK" --model haiku; then
            echo "Auth OK — the token works against the Anthropic API."
          else
            echo "::error::Token shape looks right but the API rejected it. It was likely revoked (e.g. a newer 'claude setup-token' run invalidated it) or the Claude subscription that minted it is inactive. Generate a fresh token with 'claude setup-token' and re-set the secret."
            exit 1
          fi
