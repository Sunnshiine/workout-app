name: Script tests

# Every test of the repo's own tooling, so a script change cannot land with its test unrun. The bash
# tests are found by name rather than listed, so a new `*.test.sh` or `*-test.sh` under scripts/
# runs here without an edit to this file. Some also run in the workflow that owns their subject
# (lint, verify-tools, workflow-lint, skill-links); this job is the one place they all run.
on:
  pull_request:
    paths:
      - "scripts/**"
      - ".sandcastle/**"
      - ".claude/settings.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/script-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".sandcastle/**"
      - ".claude/settings.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/script-tests.yml"
  workflow_dispatch:

concurrency:
  group: script-tests-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

jobs:
  script-tests:
    # macOS, because the scripts target the bash 3.2 and BSD tools an agent's Mac has.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned SwiftLint version
        id: swiftlint
        run: echo "version=$(scripts/lint.sh --print-version)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned SwiftLint binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftlint
          key: swiftlint-${{ runner.os }}-${{ steps.swiftlint.outputs.version }}
      - name: Bash script tests
        env:
          SWIFTLINT_CACHE_DIR: ${{ runner.temp }}/swiftlint
        run: |
          status=0
          tests=$(find scripts \( -name '*.test.sh' -o -name '*-test.sh' \) | sort)
          for test in $tests; do
            echo "::group::$test"
            if ! "$test"; then
              echo "::error::$test failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:prototype
      - run: npm run test:sandcastle
      - run: npm run typecheck:sandcastle
