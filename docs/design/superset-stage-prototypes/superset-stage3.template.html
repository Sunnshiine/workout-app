<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>SUPERSET STAGE — partner tone (#430)</title>
<style>
/* THROWAWAY PROTOTYPE — issue #430, round four.
   Verdicts: A (tone coupling) wins the focus tie, F (living paper) wins the
   sheet. But round three's partner sage (#6F8B75) read as a DEAD branch — too
   gray. This round: five living-green partner tones on the locked A
   composition. The partner must stay clearly subordinate to the focused
   branch (#0D6B40) while reading alive. One screen, re-inked per variant:
     a — quiet action: the SAME green, just translucent (hue-true quieting —
         "same plant, further from the light")
     b — foliage: #579168, the night leaf pigment doing day duty
     c — sage-mint: #6FAE87, cooler and brighter
     d — spring: #7FB069, yellow-green new growth
     e — moss: #2F7A4E, subordination by depth instead of lightness
   The partner's name line follows its branch tone (darkened where needed to
   stay legible at 19.5px on the paper).
*/
/*__FONTS__*/
:root {
  --ink: #152118;
  --muted: #526457;
  --action: #0D6B40;
  --action-text: #F2F7E8;
  --cream: #F2F7E8;
  --surface: rgba(242, 247, 232, 0.52);
  --surface-shadow: 0 1px 2px rgba(21, 33, 24, 0.04), 0 14px 30px rgba(21, 33, 24, 0.07);
  --pill-fill: rgba(242, 247, 232, 0.85);
  --pill-stroke: rgba(82, 111, 90, 0.34);
  --foot-fill: rgba(242, 247, 232, 0.50);
  --queue-stroke: rgba(82, 111, 90, 0.38);
  --log-shadow: 0 1px 2px rgba(13, 46, 28, 0.22), 0 10px 22px rgba(13, 60, 35, 0.16);
  --stem: #0D6B40;
  --leaf-fill: #0D6B40;
  --leaf-rib: rgba(242, 247, 232, 0.5);
  --bud-fill: rgba(242, 247, 232, 0.95);
  --bud-stroke: #0D6B40;
  --bud-rib: rgba(13, 107, 64, 0.55);
  --future-stroke: rgba(13, 107, 64, 0.40);
  --home-bar: rgba(21, 33, 24, 0.20);
  --paper:
    radial-gradient(90% 46% at 18% 4%,   rgba(255,250,224,0.85) 0%, transparent 60%),
    radial-gradient(70% 40% at 108% 32%, rgba(163,205,154,0.55) 0%, transparent 70%),
    radial-gradient(80% 42% at -10% 62%, rgba(214,232,197,0.70) 0%, transparent 65%),
    radial-gradient(110% 55% at 55% 108%, rgba(151,189,140,0.75) 0%, transparent 70%),
    linear-gradient(180deg, #E9EEDC 0%, #CBE1C2 100%);
}
/* the partner tone per variant: branch pigment, its faint future-bud stroke,
   and the name-line text tone */
body[data-variant="a"] {
  --partner: rgba(13, 107, 64, 0.52);
  --partner-future: rgba(13, 107, 64, 0.30);
  --partner-text: rgba(13, 107, 64, 0.68);
}
body[data-variant="b"] {
  --partner: #579168;
  --partner-future: rgba(87, 145, 104, 0.48);
  --partner-text: #4A7D59;
}
body[data-variant="c"] {
  --partner: #6FAE87;
  --partner-future: rgba(111, 174, 135, 0.50);
  --partner-text: #55876D;
}
body[data-variant="d"] {
  --partner: #7FB069;
  --partner-future: rgba(127, 176, 105, 0.50);
  --partner-text: #5E8A4C;
}
body[data-variant="e"] {
  --partner: #2F7A4E;
  --partner-future: rgba(47, 122, 78, 0.42);
  --partner-text: #2F7A4E;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  position: relative;
  width: 393px;
  height: 852px;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Source Sans 3', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.screen { display: flex; flex-direction: column; width: 393px; height: 852px; position: relative; }

.num { font-variant-numeric: tabular-nums; }
button { font-family: inherit; cursor: pointer; }
input { font-family: inherit; }

.time {
  position: absolute; top: 21px; left: 36px;
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.home-indicator {
  position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px; background: var(--home-bar);
}

.col { display: flex; flex-direction: column; height: 100%; padding: 0 32px; }

.runline {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 68px;
  font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.runline .right { color: var(--muted); font-weight: 500; }

h1.exercise {
  margin: 22px 0 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 30, "wght" 490, "SOFT" 100, "WONK" 0;
  font-size: 33px; line-height: 1.10; color: var(--ink);
}
.partner-line {
  margin: 7px 0 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 18, "wght" 470, "SOFT" 100, "WONK" 0;
  font-size: 19.5px; line-height: 1.15; color: var(--partner-text);
}
.partner-line .amp { opacity: 0.75; margin-right: 2px; }
.coach-note {
  margin: 10px 0 0;
  font-size: 15px; line-height: 1.45; color: var(--muted);
  max-width: 305px;
}

.branch-wrap { position: relative; margin-top: 10px; height: 138px; }
.branch-wrap svg { display: block; }

.last-performed {
  margin-bottom: 12px;
  font-size: 12.5px; line-height: 1.5; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}

.flex-grow { flex: 1; }

.set-surface {
  background: var(--surface);
  border-radius: 30px;
  padding: 16px 16px 14px;
  box-shadow: var(--surface-shadow);
}
.set-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 8px; }
.set-head .setno { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.set-head .ofm { font-size: 14px; font-weight: 500; color: var(--muted); }
.weight-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 0 4px; }
.weight-row .weight-open {
  flex: 1; text-align: center;
  border: 0; background: transparent; color: var(--ink);
  font-size: 46px; font-weight: 700; letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums; outline: none; min-width: 0;
}
.big-step {
  width: 54px; height: 54px; flex: none;
  border: 1px solid var(--pill-stroke); border-radius: 999px;
  background: var(--pill-fill); color: var(--action);
  font-size: 25px; font-weight: 600; line-height: 1;
}
.rails-pair { display: flex; gap: 10px; margin-top: 10px; }
.rails-pair .rail-cell { flex: 1; min-width: 0; }
.rail-lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
.rail-lbl.below { margin-top: 6px; }
.rail {
  flex: 1; min-width: 0; position: relative;
  display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory;
  background: rgba(242, 247, 232, 0.55);
  border: 1px solid var(--pill-stroke);
  border-radius: 18px; padding: 5px;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
.rail::-webkit-scrollbar { display: none; }
.rail .chip {
  flex: none; scroll-snap-align: center;
  min-width: 48px; height: 44px;
  border: 0; border-radius: 14px; background: transparent;
  font-size: 17px; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums; position: relative;
}
.rail .chip.dim { color: var(--muted); font-weight: 600; }
.rail .chip.sel { background: var(--cream); box-shadow: inset 0 0 0 2px var(--action); }
.rail .chip .presc {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  width: 18px; height: 3px; border-radius: 2px; background: var(--action);
}
.log-btn {
  display: block; position: relative; overflow: hidden;
  margin-top: 14px; width: 100%; height: 62px;
  border: 0; border-radius: 999px;
  background: var(--action); color: var(--action-text);
  font-size: 18px; font-weight: 650;
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  box-shadow: var(--log-shadow);
}

.stage-foot { display: flex; align-items: center; gap: 14px; margin: 16px 0 38px; }
.upnext-bar {
  flex: 1; min-width: 0; padding-left: 4px;
  font-size: 13.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.upnext-bar .name { color: var(--ink); font-weight: 600; }
.queue-btn {
  display: flex; align-items: center; flex: none;
  background: var(--foot-fill);
  border: 1px solid var(--queue-stroke);
  border-radius: 999px;
  padding: 0 16px; height: 44px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* ————— switcher (NOT part of the design) ————— */
.switcher {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; align-items: center; gap: 2px;
  background: #111; color: #fff; border-radius: 999px; padding: 4px 6px;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.switcher a { color: #fff; text-decoration: none; padding: 2px 8px; font-size: 14px; line-height: 1; }
.switcher .label { padding: 0 6px; white-space: nowrap; }
</style>
</head>
<body data-variants="a,b,c,d,e" data-variant="a">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="leafShape" d="M0 8 C 15 2.3, 41 3.3, 60 8 C 41 21.7, 15 22.6, 0 8 Z"/>
    <path id="leafRib" d="M4 8.1 C 20 9.8, 40 9.6, 56 8.1" fill="none"/>
  </defs>
</svg>

<!-- one screen, re-inked per variant -->
<section class="screen" id="screen">
  <div class="time num">9:41</div>
  <div class="col">
    <div class="runline"><span class="num">Block 27 · Week 2 · Day 2</span><span class="right num">9 Sets left</span></div>
    <h1 class="exercise">DB Incline Press</h1>
    <div class="partner-line"><span class="amp">&amp;</span> Chest-Supported Row</div>
    <p class="coach-note">Keep the dumbbells honest at the bottom — full stretch, no&nbsp;rush.</p>
    <div class="branch-wrap">
      <svg id="branch" width="329" height="138" viewBox="0 0 329 138" aria-label="DB Incline Press Set 2 of 4, Chest-Supported Row 1 of 3 logged">
        <path id="fork-main" d="M 8 128 C 40 122, 62 115, 80 106 C 148 74, 240 42, 314 14" fill="none" stroke="var(--stem)" stroke-width="2" stroke-linecap="round"/>
        <path id="fork-side" d="M 80 106 C 128 106, 182 112, 244 122" fill="none" stroke="var(--partner)" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="flex-grow"></div>
    <div class="last-performed num">W1 D2 — 30×10 @8 · 30×10 @8 · 30×9 @9</div>
    <div class="set-surface">
      <div class="set-head"><span><span class="setno num">Set 2</span><span class="ofm num"> of 4</span></span></div>
      <div class="weight-row num">
        <button class="big-step">−</button>
        <input class="weight-open" type="text" inputmode="decimal" value="30" data-weight-input>
        <button class="big-step">+</button>
      </div>
      <div class="rails-pair num">
        <div class="rail-cell">
          <div class="rail" data-reps-rail></div>
          <div class="rail-lbl below">Reps</div>
        </div>
        <div class="rail-cell">
          <div class="rail" data-rpe-rail></div>
          <div class="rail-lbl below">RPE</div>
        </div>
      </div>
      <button class="log-btn num" data-log-cap>Log 30 × 10 @8</button>
    </div>
    <div class="stage-foot">
      <div class="upnext-bar">Up next · <span class="name">Chest-Supported Row</span> — Set 2</div>
      <div class="queue-btn num">3 of 6</div>
    </div>
  </div>
  <div class="home-indicator"></div>
</section>

<nav class="switcher">
  <a id="sw-prev" href="#">‹</a>
  <span class="label" id="sw-label"></span>
  <a id="sw-next" href="#">›</a>
</nav>

<script>
  const KEYS = ['a', 'b', 'c', 'd', 'e'];
  const NAMES = {
    a: 'A · Quiet action (translucent)',
    b: 'B · Foliage #579168',
    c: 'C · Sage-mint #6FAE87',
    d: 'D · Spring #7FB069',
    e: 'E · Moss #2F7A4E'
  };

  // ——— branch drawing; nodes are cleared and re-inked on every variant switch
  // so the in-place switcher shows live tones ———
  function drawNodes(stemId, nodes, tone) {
    const stem = document.getElementById(stemId);
    const svg = stem.ownerSVGElement;
    const css = getComputedStyle(document.body);
    const C = (name) => css.getPropertyValue(name).trim();
    const NS = 'http://www.w3.org/2000/svg';
    const L = stem.getTotalLength();
    const leafFill = tone === 'partner' ? C('--partner') : C('--leaf-fill');
    const futureStroke = tone === 'partner' ? C('--partner-future') : C('--future-stroke');
    nodes.forEach((n) => {
      const p = stem.getPointAtLength(n.t * L);
      const q = stem.getPointAtLength(Math.min(L, n.t * L + 1.5));
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      const rot = ang + n.side * n.spread;
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('data-node', '');
      g.setAttribute('transform',
        'translate(' + p.x + ' ' + p.y + ') rotate(' + rot + ') scale(' + n.s + ') translate(0 -8)');
      const use = (href, attrs) => {
        const el = document.createElementNS(NS, 'use');
        el.setAttribute('href', href);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        g.appendChild(el);
      };
      if (n.kind === 'leaf') {
        use('#leafShape', { fill: leafFill });
        use('#leafRib', { stroke: C('--leaf-rib'), 'stroke-width': (1.2 / n.s).toFixed(2) });
      } else if (n.kind === 'current') {
        use('#leafShape', { fill: C('--bud-fill'), stroke: C('--bud-stroke'), 'stroke-width': (2.2 / n.s).toFixed(2) });
        use('#leafRib', { stroke: C('--bud-rib'), 'stroke-width': (1.2 / n.s).toFixed(2) });
      } else {
        use('#leafShape', { fill: 'none', stroke: futureStroke, 'stroke-width': (1.2 / n.s).toFixed(2) });
      }
      svg.appendChild(g);
    });
  }

  const forkFocused = [
    { t: 0.40, kind: 'leaf',    s: 0.72, spread: 46, side: -1 },
    { t: 0.60, kind: 'current', s: 0.56, spread: 34, side: -1 },
    { t: 0.79, kind: 'bud',     s: 0.28, spread: 24, side: 1 },
    { t: 0.92, kind: 'bud',     s: 0.20, spread: 20, side: -1 }
  ];
  const forkPartner = [
    { t: 0.34, kind: 'leaf',    s: 0.58, spread: 44, side: 1 },
    { t: 0.66, kind: 'bud',     s: 0.30, spread: 26, side: 1 },
    { t: 0.92, kind: 'bud',     s: 0.22, spread: 20, side: -1 }
  ];
  function ink() {
    document.querySelectorAll('#branch [data-node]').forEach((g) => g.remove());
    drawNodes('fork-main', forkFocused);
    drawNodes('fork-side', forkPartner, 'partner');
  }

  const param = new URLSearchParams(location.search).get('variant');
  function show(key) {
    document.body.dataset.variant = key;
    const i = KEYS.indexOf(key);
    document.getElementById('sw-label').textContent = NAMES[key];
    document.getElementById('sw-prev').onclick = (e) => { e.preventDefault(); show(KEYS[(i + KEYS.length - 1) % KEYS.length]); };
    document.getElementById('sw-next').onclick = (e) => { e.preventDefault(); show(KEYS[(i + 1) % KEYS.length]); };
    ink();
  }
  show(KEYS.includes(param) ? param : 'a');

  // ——— the #455 input block, live enough to render ———
  const RPE_SCALE = [];
  for (let v = 5; v <= 10; v += 0.5) RPE_SCALE.push(v);
  const REPS_SCALE = [];
  for (let v = 1; v <= 100; v += 1) REPS_SCALE.push(v);
  const state = { weight: 30, reps: 10, rpe: 8, lastReps: 10, lastRpe: 8 };
  const cap = document.querySelector('[data-log-cap]');
  const sync = () => { cap.textContent = 'Log ' + state.weight + ' × ' + state.reps + ' @' + state.rpe; };
  const wire = (host, values, last, current, set) => {
    values.forEach((v) => {
      const b = document.createElement('button');
      b.className = 'chip' + (Math.abs(v - last) > 2 ? ' dim' : '');
      b.innerHTML = v + (v === last ? '<span class="presc"></span>' : '');
      if (v === current) b.classList.add('sel');
      b.addEventListener('click', () => {
        set(v); sync();
        host.querySelectorAll('.chip').forEach((c) => c.classList.remove('sel'));
        b.classList.add('sel');
      });
      host.appendChild(b);
    });
    requestAnimationFrame(() => {
      const sel = host.querySelector('.sel');
      if (sel) host.scrollLeft = sel.offsetLeft - (host.clientWidth - sel.offsetWidth) / 2;
    });
  };
  wire(document.querySelector('[data-reps-rail]'), REPS_SCALE, state.lastReps, state.reps, (v) => { state.reps = v; });
  wire(document.querySelector('[data-rpe-rail]'), RPE_SCALE, state.lastRpe, state.rpe, (v) => { state.rpe = v; });
  sync();
</script>
</body>
</html>
