<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Sunbird, Midnight glass (dark icon). Decided in issue #370; geometry and
       glass recipe are verbatim from the final prototype round. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050806"/><stop offset="1" stop-color="#041C11"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <radialGradient id="am1" cx="0.22" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#73FFB8" stop-opacity="0.22"/><stop offset="1" stop-color="#73FFB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="am2" cx="0.85" cy="0.95" r="0.8">
      <stop offset="0" stop-color="#3d9dff" stop-opacity="0.16"/><stop offset="1" stop-color="#3d9dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.38" stop-color="#73FFB8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#73FFB8" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="bird"><rect width="1024" height="1024" fill="#fff"/><path d="M 230 440 C 360 415 465 465 512 510 C 559 465 664 415 794 440 C 686 470 592 518 512 592 C 432 518 338 470 230 440 Z" fill="#000"/></mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g mask="url(#bird)">
    <rect width="1024" height="1024" fill="url(#am1)"/>
    <rect width="1024" height="1024" fill="url(#am2)"/>
    <g filter="url(#blur)" opacity="0.55" transform="translate(0,22)"><circle cx="512" cy="512" r="396" fill="#73FFB8"/></g>
    <circle cx="512" cy="512" r="396" fill="url(#body)"/>
    <circle cx="512" cy="512" r="396" fill="none" stroke="url(#rim)" stroke-width="9"/>
    <ellipse cx="300" cy="-80" rx="900" ry="520" fill="url(#sheen)"/>
  </g>
</svg>
