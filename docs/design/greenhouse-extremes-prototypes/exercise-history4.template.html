<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>EXERCISE HISTORY — against the wall of text (#434)</title>
<style>
/* THROWAWAY PROTOTYPE — issue #434, round four.
   Owner verdict on round three: none of the five carved takes land, and the
   deeper diagnosis is that Exercise History reads as a wall of text. The
   prose set line is the wall. This round holds the grouping deliberately
   quiet (air + muted Block header) and varies ONLY the row anatomy — five
   vastly different ways to render the same sessions. ?variant= :
     a — headline set: radical summarization; one big top set per session,
         everything else demoted to a tiny sub-line
     b — true columns: the prose line tabulated — load | reps | effort as
         aligned columns, nothing to read left-to-right
     c — set chips: every set a small carved chip; objects, not sentences.
         Deliberate rule-bend: the TEXT never wraps, but chips may flow to
         a second line
     d — trend: the most radical; history as a load-over-time chart with
         micro rows beneath, numbers mostly on demand
     e — load ledger: typographic hierarchy; the load is a giant numeral,
         reps and effort orbit it small and muted
   Non-negotiables carried: no text wrap (shrink-then-truncate), no mint in
   the sheet, .medium detent, hard mix (skip · as-"…" fallback · Legacy Log
   as entered · 8-Set line) on every screen, Fraunces only on the title.
*/
/*__FONTS__*/
:root {
  --paper-top: #E8EDDB;
  --paper-bottom: #C7E0BF;
  --ink: #152118;
  --muted: #526457;
  --cream: #F2F7E8;
  --sheet-fill: #EFF4E4;
  --sheet-shadow: 0 -8px 40px rgba(21, 33, 24, 0.18);
  --grabber: rgba(21, 33, 24, 0.18);
  --scrim: rgba(21, 33, 24, 0.32);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  position: relative;
  width: 393px;
  height: 852px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--paper-top) 0%, var(--paper-bottom) 100%);
  color: var(--ink);
  font-family: 'Source Sans 3', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.screen { display: none; width: 393px; height: 852px; position: relative; }
body[data-variant="a"] #screen-a { display: block; }
body[data-variant="b"] #screen-b { display: block; }
body[data-variant="c"] #screen-c { display: block; }
body[data-variant="d"] #screen-d { display: block; }
body[data-variant="e"] #screen-e { display: block; }

.num { font-variant-numeric: tabular-nums; }

.stage-behind { position: absolute; inset: 0; padding: 0 32px; }
.stage-behind .time {
  position: absolute; top: 21px; left: 36px;
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.stage-behind .runline {
  display: flex; justify-content: space-between;
  margin-top: 68px;
  font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.stage-behind .runline .right { color: var(--muted); font-weight: 500; }
.stage-behind .cadence { margin: 30px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.stage-behind h1 {
  margin: 6px 0 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 30, "wght" 490, "SOFT" 100, "WONK" 0;
  font-size: 33px; font-weight: 490; line-height: 1.10;
}
.scrim { position: absolute; inset: 0; background: var(--scrim); }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 472px;
  background: var(--sheet-fill);
  border-radius: 30px 30px 0 0;
  box-shadow: var(--sheet-shadow);
  padding: 8px 26px 0;
  overflow: hidden;
}
.grabber {
  width: 40px; height: 5px; border-radius: 3px;
  background: var(--grabber);
  margin: 0 auto;
}
.sheet-title {
  margin: 16px 2px 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 22, "wght" 490, "SOFT" 100, "WONK" 0;
  font-size: 24px; font-weight: 490; line-height: 1.1;
}
.sheet-sub {
  margin: 4px 2px 0;
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}

/* quiet grouping — constant across this round; the row is the variable */
.block-head {
  margin: 18px 2px 0;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mutd { color: var(--muted); }
.ital { font-style: italic; color: var(--muted); }

/* ————— a · headline set ————— */
#screen-a .hrow { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
#screen-a .hrow .headline { flex: none; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
#screen-a .hrow .headline .x { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 1px; }
#screen-a .hrow .headline .reps { font-size: 16px; font-weight: 650; }
#screen-a .hrow .rpe { flex: 1; font-size: 13px; color: var(--muted); }
#screen-a .hrow .raw { font-size: 15px; font-style: italic; font-weight: 500; }
#screen-a .subline {
  margin-top: 1px; font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
#screen-a .subline .warn { font-style: italic; }

/* ————— b · true columns ————— */
#screen-b .thead {
  display: grid; grid-template-columns: 52px 52px 1fr 58px;
  gap: 10px; margin-top: 10px;
  font-size: 10.5px; font-weight: 600; color: var(--muted);
}
#screen-b .trow {
  display: grid; grid-template-columns: 52px 52px 1fr 58px;
  gap: 10px; margin-top: 10px; align-items: baseline;
}
#screen-b .trow .wd { font-size: 13px; font-weight: 700; }
#screen-b .trow .load { font-size: 15px; font-weight: 700; text-align: right; }
#screen-b .trow .reps { font-size: 14px; }
#screen-b .trow .reps .skip { font-style: italic; color: var(--muted); }
#screen-b .trow .rpe { font-size: 12.5px; color: var(--muted); text-align: right; }
#screen-b .trow .span3 { grid-column: 2 / 5; font-size: 13.5px; }

/* ————— c · set chips ————— */
#screen-c .crow { display: flex; gap: 10px; margin-top: 11px; align-items: flex-start; }
#screen-c .crow .gutter { flex: none; width: 50px; padding-top: 3px; }
#screen-c .crow .gutter .wd { font-size: 12.5px; font-weight: 700; }
#screen-c .crow .gutter .cad { font-size: 10.5px; font-weight: 600; color: var(--muted); }
#screen-c .chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 5px; }
#screen-c .chip {
  font-size: 12px; font-weight: 600;
  padding: 3px 8px 4px; border-radius: 999px;
  background: rgba(21, 33, 24, 0.055);
  box-shadow: inset 0 1px 2px rgba(21, 33, 24, 0.14), 0 1px 0 rgba(255, 255, 255, 0.6);
  font-variant-numeric: tabular-nums;
}
#screen-c .chip .rpe { font-weight: 500; color: var(--muted); }
#screen-c .chip.skipchip { background: transparent; box-shadow: none; border: 1.5px dashed rgba(82, 100, 87, 0.5); color: var(--muted); font-style: italic; font-weight: 500; }
#screen-c .chip.rawchip { font-style: italic; font-weight: 500; color: var(--muted); background: transparent; box-shadow: inset 0 1px 2px rgba(21, 33, 24, 0.10); max-width: 100%; }
#screen-c .chip.rawchip .txt { display: block; }
#screen-c .asline { flex-basis: 100%; font-size: 11px; font-style: italic; color: var(--muted); margin: -1px 0 1px; }

/* ————— d · trend ————— */
#screen-d .chart { position: relative; margin: 20px 2px 0; height: 148px; }
#screen-d .chart svg { position: absolute; inset: 0; overflow: visible; }
#screen-d .dotlabel {
  position: absolute; transform: translateX(-50%);
  font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
#screen-d .axislabel {
  position: absolute; transform: translateX(-50%);
  font-size: 10px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums; text-align: center; line-height: 1.25;
}
#screen-d .axislabel .b { display: block; }
#screen-d .rawmark { position: absolute; transform: translateX(-50%); font-size: 10.5px; font-style: italic; color: var(--muted); text-align: center; }
#screen-d .microrows { margin-top: 14px; }
#screen-d .micro {
  display: flex; gap: 8px; align-items: baseline; margin-top: 7px;
  font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
}
#screen-d .micro .wd { flex: none; width: 62px; font-weight: 700; color: var(--ink); }
#screen-d .micro .line { flex: 1; }

/* ————— e · load ledger ————— */
#screen-e .lrow { display: flex; gap: 14px; align-items: center; margin-top: 13px; }
#screen-e .lrow .load { flex: none; width: 76px; text-align: right; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
#screen-e .lrow .load .unit { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
#screen-e .lrow .load.rawload { font-size: 16px; font-style: italic; font-weight: 600; letter-spacing: 0; }
#screen-e .lrow .rest { flex: 1; min-width: 0; }
#screen-e .lrow .repline { font-size: 13.5px; font-variant-numeric: tabular-nums; }
#screen-e .lrow .repline .skip { font-style: italic; color: var(--muted); }
#screen-e .lrow .repline .rpe { color: var(--muted); font-size: 12px; }
#screen-e .lrow .metaline { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
#screen-e .lrow .metaline .warn { font-style: italic; }

/* ————— switcher (NOT part of the design) ————— */
.switcher {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; align-items: center; gap: 2px;
  background: #111; color: #fff; border-radius: 999px; padding: 4px 6px;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.switcher a { color: #fff; text-decoration: none; padding: 2px 8px; font-size: 14px; line-height: 1; }
.switcher .label { padding: 0 6px; white-space: nowrap; }
</style>
</head>
<body data-variants="a,b,c,d,e" data-variant="a">

<template id="stage-tpl">
  <div class="stage-behind">
    <div class="time num">9:41</div>
    <div class="runline"><span class="num">Block 27 · Week 2 · Day 1</span><span class="right num">9 Sets left</span></div>
    <div class="cadence num">0:2:0</div>
    <h1>Hamstring Curl</h1>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-title">Hamstring Curl</div>
    <div class="sheet-sub num">Exercise History · last 5</div>
    <div class="sheet-body"></div>
  </div>
</template>

<section class="screen" id="screen-a"></section>
<section class="screen" id="screen-b"></section>
<section class="screen" id="screen-c"></section>
<section class="screen" id="screen-d"></section>
<section class="screen" id="screen-e"></section>

<nav class="switcher">
  <a id="sw-prev" href="#">‹</a>
  <span class="label" id="sw-label"></span>
  <a id="sw-next" href="#">›</a>
</nav>

<script>
  const KEYS = ['a', 'b', 'c', 'd', 'e'];
  const NAMES = {
    a: 'A · Headline set',
    b: 'B · True columns',
    c: 'C · Set chips',
    d: 'D · Trend',
    e: 'E · Load ledger'
  };
  const param = new URLSearchParams(location.search).get('variant');
  const key = KEYS.includes(param) ? param : 'a';
  document.body.dataset.variant = key;
  const i = KEYS.indexOf(key);
  document.getElementById('sw-label').textContent = NAMES[key];
  document.getElementById('sw-prev').href = '?variant=' + KEYS[(i + KEYS.length - 1) % KEYS.length];
  document.getElementById('sw-next').href = '?variant=' + KEYS[(i + 1) % KEYS.length];

  // The same five sessions as every round, structured instead of prose.
  const ENTRIES = [
    { block: 27, wd: 'W1 D1', cad: '0:2:0',
      sets: [{ w: 27.5, r: 10, rpe: 8 }, { w: 27.5, r: 10, rpe: 8 }, { w: 27.5, r: 9, rpe: 9 }] },
    { block: 26, wd: 'W4 D1', cad: '0:2:0',
      sets: [{ w: 25, r: 10, rpe: 8 }, { skip: true }, { w: 25, r: 10, rpe: 9 }] },
    { block: 26, wd: 'W3 D1', asname: 'Seated Ham Curl',
      sets: [{ w: 25, r: 12, rpe: 8 }, { w: 25, r: 11, rpe: 8.5 }, { w: 25, r: 10, rpe: 9 }] },
    { block: 26, wd: 'W2 D1', raw: '55x8, 60x7@9.5, 60' },
    { block: 26, wd: 'W1 D1', cad: '0:2:0',
      sets: [{ w: 22.5, r: 12, rpe: 7 }, { w: 22.5, r: 12, rpe: 7.5 }, { w: 22.5, r: 11, rpe: 8 }, { w: 22.5, r: 11, rpe: 8 }, { w: 22.5, r: 10, rpe: 8.5 }, { w: 22.5, r: 10, rpe: 9 }, { w: 22.5, r: 9, rpe: 9 }, { w: 22.5, r: 8, rpe: 9.5 }] }
  ];
  const BLOCKS = [...new Set(ENTRIES.map((e) => e.block))];

  function el(cls, html, tag) {
    const d = document.createElement(tag || 'div');
    d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function stampBase(screenId) {
    const screen = document.getElementById(screenId);
    screen.appendChild(document.getElementById('stage-tpl').content.cloneNode(true));
    return screen.querySelector('.sheet-body');
  }
  function done(e) { return e.sets ? e.sets.filter((s) => !s.skip) : []; }
  function rpeRange(e) {
    const r = done(e).map((s) => s.rpe);
    if (!r.length) return '';
    const lo = Math.min(...r), hi = Math.max(...r);
    return lo === hi ? '@' + lo : '@' + lo + '–' + hi;
  }
  function topSet(e) {
    return done(e).reduce((a, s) => (!a || s.w > a.w || (s.w === a.w && s.r > a.r) ? s : a), null);
  }
  function eachBlock(body, fn) {
    BLOCKS.forEach((b) => {
      body.appendChild(el('block-head num', 'Block ' + b));
      ENTRIES.filter((e) => e.block === b).forEach(fn.bind(null, body));
    });
  }

  // a · headline set — one big top set, the rest demoted
  {
    const body = stampBase('screen-a');
    eachBlock(body, (host, e) => {
      const wrap = el('');
      const row = el('hrow');
      if (e.raw) {
        row.appendChild(el('raw nowrap num', e.raw));
      } else {
        const t = topSet(e);
        row.appendChild(el('headline num',
          t.w + '<span class="x">×</span><span class="reps">' + t.r + '</span>'));
        row.appendChild(el('rpe nowrap num', rpeRange(e)));
      }
      wrap.appendChild(row);
      const skips = e.sets ? e.sets.filter((s) => s.skip).length : 0;
      const bits = [e.wd];
      if (e.raw) bits.push('<span class="warn">as entered</span>');
      else bits.push(done(e).length + ' sets' + (skips ? ' · <span class="warn">1 skipped</span>' : ''));
      if (e.asname) bits.push('<span class="warn">as “' + e.asname + '”</span>');
      if (e.cad) bits.push(e.cad);
      wrap.appendChild(el('subline nowrap num', bits.join(' · ')));
      host.appendChild(wrap);
    });
  }

  // b · true columns — load | reps | effort, aligned
  {
    const body = stampBase('screen-b');
    BLOCKS.forEach((b, bi) => {
      body.appendChild(el('block-head num', 'Block ' + b));
      if (bi === 0) {
        const head = el('thead');
        ['', 'kg', 'reps', 'effort'].forEach((h) => head.appendChild(el('nowrap', h)));
        body.appendChild(head);
      }
      ENTRIES.filter((e) => e.block === b).forEach((e) => {
        const row = el('trow');
        row.appendChild(el('wd nowrap num', e.wd));
        if (e.raw) {
          row.appendChild(el('span3 ital nowrap num', 'as entered — ' + e.raw));
        } else {
          const loads = [...new Set(done(e).map((s) => s.w))];
          row.appendChild(el('load nowrap num', loads.join('–')));
          const reps = e.sets.map((s) => s.skip ? '<span class="skip">skip</span>' : s.r).join(' · ');
          const repsCell = el('reps nowrap num', reps + (e.asname ? '' : ''));
          row.appendChild(repsCell);
          row.appendChild(el('rpe nowrap num', rpeRange(e)));
        }
        body.appendChild(row);
        if (e.asname) {
          const as = el('trow');
          as.appendChild(el('', ''));
          as.appendChild(el('span3 ital nowrap', 'as “' + e.asname + '”'));
          as.style.marginTop = '1px';
          body.appendChild(as);
        }
      });
    });
  }

  // c · set chips — objects, not sentences; chips may flow, text never wraps
  {
    const body = stampBase('screen-c');
    eachBlock(body, (host, e) => {
      const row = el('crow');
      const g = el('gutter');
      g.appendChild(el('wd num', e.wd));
      if (e.cad) g.appendChild(el('cad num', e.cad));
      row.appendChild(g);
      const chips = el('chips');
      if (e.asname) chips.appendChild(el('asline nowrap', 'as “' + e.asname + '”'));
      if (e.raw) {
        chips.appendChild(el('chip rawchip num', '<span class="txt nowrap">as entered — ' + e.raw + '</span>'));
      } else {
        e.sets.forEach((s) => {
          chips.appendChild(s.skip
            ? el('chip skipchip', 'skip')
            : el('chip num', s.w + '×' + s.r + ' <span class="rpe">@' + s.rpe + '</span>'));
        });
      }
      row.appendChild(chips);
      host.appendChild(row);
    });
  }

  // d · trend — load over time; numbers mostly on demand
  {
    const body = stampBase('screen-d');
    const chrono = [...ENTRIES].reverse();
    const chart = el('chart');
    const W = 341, H = 148, padX = 26, plotTop = 26, plotBot = 118;
    const xs = chrono.map((_, idx) => padX + idx * ((W - 2 * padX) / (chrono.length - 1)));
    const parsed = chrono.map((e) => e.raw ? null : topSet(e).w);
    const lo = 20, hi = 30;
    const y = (w) => plotBot - ((w - lo) / (hi - lo)) * (plotBot - plotTop);
    let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    let path = '';
    chrono.forEach((e, idx) => {
      if (parsed[idx] == null) return;
      path += (path ? ' L ' : 'M ') + xs[idx] + ' ' + y(parsed[idx]);
    });
    svg += '<path d="' + path + '" fill="none" stroke="rgba(21,33,24,0.35)" stroke-width="1.5"/>';
    const bBoundary = chrono.findIndex((e, idx) => idx > 0 && e.block !== chrono[idx - 1].block);
    if (bBoundary > 0) {
      const bx = (xs[bBoundary - 1] + xs[bBoundary]) / 2;
      svg += '<line x1="' + bx + '" y1="' + (plotTop - 12) + '" x2="' + bx + '" y2="' + (plotBot + 6) +
        '" stroke="rgba(21,33,24,0.14)" stroke-width="1" stroke-dasharray="1 4" stroke-linecap="round"/>';
    }
    chrono.forEach((e, idx) => {
      if (parsed[idx] == null) return;
      svg += '<circle cx="' + xs[idx] + '" cy="' + y(parsed[idx]) + '" r="4.5" fill="#152118"/>';
      svg += '<circle cx="' + xs[idx] + '" cy="' + y(parsed[idx]) + '" r="2" fill="#EFF4E4"/>';
    });
    svg += '</svg>';
    chart.innerHTML = svg;
    chrono.forEach((e, idx) => {
      if (parsed[idx] != null) {
        const lbl = el('dotlabel num', String(parsed[idx]));
        lbl.style.left = xs[idx] + 'px';
        lbl.style.top = (y(parsed[idx]) - 22) + 'px';
        chart.appendChild(lbl);
      } else {
        const rm = el('rawmark', 'log');
        rm.style.left = xs[idx] + 'px';
        rm.style.top = (plotBot - 14) + 'px';
        chart.appendChild(rm);
      }
      const ax = el('axislabel num',
        '<span class="b">B' + e.block + '</span>' + e.wd.replace(' D1', ''));
      ax.style.left = xs[idx] + 'px';
      ax.style.top = (plotBot + 10) + 'px';
      chart.appendChild(ax);
    });
    body.appendChild(chart);
    const micro = el('microrows');
    ENTRIES.forEach((e) => {
      const m = el('micro');
      m.appendChild(el('wd nowrap num', 'B' + e.block + ' ' + e.wd));
      let line;
      if (e.raw) line = '<span class="ital">as entered — ' + e.raw + '</span>';
      else {
        line = e.sets.map((s) => s.skip ? '<span class="ital">skip</span>' : s.w + '×' + s.r + ' @' + s.rpe).join(' · ');
        if (e.asname) line = '<span class="ital">as “' + e.asname + '”</span> — ' + line;
      }
      m.appendChild(el('line nowrap num', line));
      micro.appendChild(m);
    });
    body.appendChild(micro);
  }

  // e · load ledger — the load is the hero numeral
  {
    const body = stampBase('screen-e');
    eachBlock(body, (host, e) => {
      const row = el('lrow');
      if (e.raw) {
        row.appendChild(el('load rawload nowrap num', '55–60'));
        const rest = el('rest');
        rest.appendChild(el('repline ital nowrap num', e.raw));
        rest.appendChild(el('metaline nowrap num', e.wd + ' · <span class="warn">as entered</span>'));
        row.appendChild(rest);
      } else {
        const loads = [...new Set(done(e).map((s) => s.w))];
        row.appendChild(el('load nowrap num', loads.join('–') + '<span class="unit">kg</span>'));
        const rest = el('rest');
        const reps = e.sets.map((s) => s.skip ? '<span class="skip">skip</span>' : s.r).join(' · ');
        rest.appendChild(el('repline nowrap num', reps + '  <span class="rpe">' + rpeRange(e) + '</span>'));
        const bits = [e.wd];
        if (e.asname) bits.push('<span class="warn">as “' + e.asname + '”</span>');
        if (e.cad) bits.push(e.cad);
        rest.appendChild(el('metaline nowrap num', bits.join(' · ')));
        row.appendChild(rest);
      }
      host.appendChild(row);
    });
  }
</script>
</body>
</html>
