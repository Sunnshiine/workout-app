<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>EXERCISE HISTORY — final: chips + toggleable volume (#434)</title>
<style>
/* THROWAWAY PROTOTYPE — issue #434, final composite.
   Owner verdict on round five: A's chips (RPE on chips, skip hidden,
   * note-marker) + B's total-volume graph, with a control to view/hide
   the graph. Two states, switchable via ?variant= :
     a — graph hidden (default state): the Volume control sits raised
     b — graph shown: the control is pressed in (carved = active) and the
         chart opens between the header and the ledger; rows below scroll
   The control reuses the chip vocabulary: a small pill in the header row.
*/
/*__FONTS__*/
:root {
  --paper-top: #E8EDDB;
  --paper-bottom: #C7E0BF;
  --ink: #152118;
  --muted: #526457;
  --cream: #F2F7E8;
  --sheet-fill: #EFF4E4;
  --sheet-shadow: 0 -8px 40px rgba(21, 33, 24, 0.18);
  --grabber: rgba(21, 33, 24, 0.18);
  --scrim: rgba(21, 33, 24, 0.32);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  position: relative;
  width: 393px;
  height: 852px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--paper-top) 0%, var(--paper-bottom) 100%);
  color: var(--ink);
  font-family: 'Source Sans 3', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.screen { display: none; width: 393px; height: 852px; position: relative; }
body[data-variant="a"] #screen-a { display: block; }
body[data-variant="b"] #screen-b { display: block; }

.num { font-variant-numeric: tabular-nums; }

.stage-behind { position: absolute; inset: 0; padding: 0 32px; }
.stage-behind .time {
  position: absolute; top: 21px; left: 36px;
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.stage-behind .runline {
  display: flex; justify-content: space-between;
  margin-top: 68px;
  font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.stage-behind .runline .right { color: var(--muted); font-weight: 500; }
.stage-behind .cadence { margin: 30px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.stage-behind h1 {
  margin: 6px 0 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 30, "wght" 490, "SOFT" 100, "WONK" 0;
  font-size: 33px; font-weight: 490; line-height: 1.10;
}
.scrim { position: absolute; inset: 0; background: var(--scrim); }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 472px;
  background: var(--sheet-fill);
  border-radius: 30px 30px 0 0;
  box-shadow: var(--sheet-shadow);
  padding: 8px 26px 0;
  overflow: hidden;
}
.grabber {
  width: 40px; height: 5px; border-radius: 3px;
  background: var(--grabber);
  margin: 0 auto;
}
.sheet-title {
  margin: 16px 2px 0;
  font-family: 'Fraunces', serif;
  font-variation-settings: "opsz" 22, "wght" 490, "SOFT" 100, "WONK" 0;
  font-size: 24px; font-weight: 490; line-height: 1.1;
}
.subrow {
  display: flex; align-items: center; justify-content: space-between;
  margin: 4px 2px 0;
}
.sheet-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the Volume control — chip vocabulary as a control; pressed-in = active */
.volbtn {
  font-size: 12px; font-weight: 600; color: var(--muted);
  padding: 3px 10px 4px; border-radius: 999px;
  background: rgba(242, 247, 232, 0.9);
  box-shadow: 0 1px 2px rgba(21, 33, 24, 0.10), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
}
.volbtn.active {
  color: var(--ink);
  background: rgba(21, 33, 24, 0.055);
  box-shadow: inset 0 1px 2px rgba(21, 33, 24, 0.16), 0 1px 0 rgba(255, 255, 255, 0.6);
}

.block-head {
  margin: 14px 2px 0;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.crow { display: flex; gap: 10px; margin-top: 9px; align-items: flex-start; }
.crow .gutter { flex: none; width: 52px; padding-top: 3px; }
.crow .gutter .wd { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.crow .gutter .wd .note { color: var(--muted); font-weight: 700; margin-left: 1px; }
.crow .gutter .cad { font-size: 10.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip {
  font-size: 12px; font-weight: 600;
  padding: 3px 8px 4px; border-radius: 999px;
  background: rgba(21, 33, 24, 0.055);
  box-shadow: inset 0 1px 2px rgba(21, 33, 24, 0.14), 0 1px 0 rgba(255, 255, 255, 0.6);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chip .rpe { font-weight: 500; color: var(--muted); }

.chart { position: relative; margin: 12px 2px 0; height: 82px; }
.chart svg { position: absolute; inset: 0; overflow: visible; }
.dotlabel {
  position: absolute; transform: translateX(-50%);
  font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.dotlabel.approx { font-weight: 500; color: var(--muted); font-style: italic; }
.chartcap { margin: 2px 2px 0; font-size: 10.5px; color: var(--muted); }

/* ————— switcher (NOT part of the design) ————— */
.switcher {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; align-items: center; gap: 2px;
  background: #111; color: #fff; border-radius: 999px; padding: 4px 6px;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.switcher a { color: #fff; text-decoration: none; padding: 2px 8px; font-size: 14px; line-height: 1; }
.switcher .label { padding: 0 6px; white-space: nowrap; }
</style>
</head>
<body data-variants="a,b" data-variant="a">

<template id="stage-tpl">
  <div class="stage-behind">
    <div class="time num">9:41</div>
    <div class="runline"><span class="num">Block 27 · Week 2 · Day 1</span><span class="right num">9 Sets left</span></div>
    <div class="cadence num">0:2:0</div>
    <h1>Hamstring Curl</h1>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-title">Hamstring Curl</div>
    <div class="subrow">
      <span class="sheet-sub num">Exercise History · last 5</span>
      <span class="volbtn num">Volume</span>
    </div>
    <div class="sheet-body"></div>
  </div>
</template>

<section class="screen" id="screen-a"></section>
<section class="screen" id="screen-b"></section>

<nav class="switcher">
  <a id="sw-prev" href="#">‹</a>
  <span class="label" id="sw-label"></span>
  <a id="sw-next" href="#">›</a>
</nav>

<script>
  const KEYS = ['a', 'b'];
  const NAMES = { a: 'A · Graph hidden', b: 'B · Graph shown' };
  const param = new URLSearchParams(location.search).get('variant');
  const key = KEYS.includes(param) ? param : 'a';
  document.body.dataset.variant = key;
  const i = KEYS.indexOf(key);
  document.getElementById('sw-label').textContent = NAMES[key];
  document.getElementById('sw-prev').href = '?variant=' + KEYS[(i + 1) % 2];
  document.getElementById('sw-next').href = '?variant=' + KEYS[(i + 1) % 2];

  const ENTRIES = [
    { block: 27, wd: 'W1 D1', cad: '0:2:0',
      sets: [{ w: 27.5, r: 10, rpe: 8 }, { w: 27.5, r: 10, rpe: 8 }, { w: 27.5, r: 9, rpe: 9 }] },
    { block: 26, wd: 'W4 D1', cad: '0:2:0', note: true,
      sets: [{ w: 25, r: 10, rpe: 8 }, { skip: true }, { w: 25, r: 10, rpe: 9 }] },
    { block: 26, wd: 'W3 D1', note: true,
      sets: [{ w: 25, r: 12, rpe: 8 }, { w: 25, r: 11, rpe: 8.5 }, { w: 25, r: 10, rpe: 9 }] },
    { block: 26, wd: 'W2 D1', note: true, approx: true,
      sets: [{ w: 55, r: 8 }, { w: 60, r: 7, rpe: 9.5 }, { w: 60 }] },
    { block: 26, wd: 'W1 D1', cad: '0:2:0',
      sets: [{ w: 22.5, r: 12, rpe: 7 }, { w: 22.5, r: 12, rpe: 7.5 }, { w: 22.5, r: 11, rpe: 8 }, { w: 22.5, r: 11, rpe: 8 }, { w: 22.5, r: 10, rpe: 8.5 }, { w: 22.5, r: 10, rpe: 9 }, { w: 22.5, r: 9, rpe: 9 }, { w: 22.5, r: 8, rpe: 9.5 }] }
  ];
  const BLOCKS = [...new Set(ENTRIES.map((e) => e.block))];

  function el(cls, html, tag) {
    const d = document.createElement(tag || 'div');
    d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function shown(e) { return e.sets.filter((s) => !s.skip); }
  function volume(e) { return shown(e).reduce((t, s) => t + (s.r ? s.w * s.r : 0), 0); }

  function stampLedger(body) {
    BLOCKS.forEach((b) => {
      body.appendChild(el('block-head num', 'Block ' + b));
      ENTRIES.filter((e) => e.block === b).forEach((e) => {
        const row = el('crow');
        const g = el('gutter');
        g.appendChild(el('wd num', e.wd + (e.note ? '<span class="note">*</span>' : '')));
        if (e.cad) g.appendChild(el('cad num', e.cad));
        row.appendChild(g);
        const chips = el('chips');
        shown(e).forEach((s) => {
          const label = s.r ? s.w + '×' + s.r : String(s.w);
          const rpe = s.rpe != null ? ' <span class="rpe">@' + s.rpe + '</span>' : '';
          chips.appendChild(el('chip num', label + rpe));
        });
        row.appendChild(chips);
        body.appendChild(row);
      });
    });
  }

  function stampChart(body) {
    const chrono = [...ENTRIES].reverse();
    const chart = el('chart');
    const W = 341, padX = 24, plotTop = 18, plotBot = 64;
    const xs = chrono.map((_, idx) => padX + idx * ((W - 2 * padX) / (chrono.length - 1)));
    const vols = chrono.map((e) => volume(e));
    const y = (v) => plotBot - (v / 2000) * (plotBot - plotTop);
    let svg = '<svg width="' + W + '" height="82" viewBox="0 0 ' + W + ' 82">';
    let path = '';
    chrono.forEach((e, idx) => { path += (path ? ' L ' : 'M ') + xs[idx] + ' ' + y(vols[idx]); });
    svg += '<path d="' + path + '" fill="none" stroke="rgba(21,33,24,0.35)" stroke-width="1.5"/>';
    const bi = chrono.findIndex((e, idx) => idx > 0 && e.block !== chrono[idx - 1].block);
    if (bi > 0) {
      const bx = (xs[bi - 1] + xs[bi]) / 2;
      svg += '<line x1="' + bx + '" y1="' + (plotTop - 10) + '" x2="' + bx + '" y2="' + (plotBot + 6) +
        '" stroke="rgba(21,33,24,0.14)" stroke-width="1" stroke-dasharray="1 4" stroke-linecap="round"/>';
    }
    chrono.forEach((e, idx) => {
      if (e.approx) {
        svg += '<circle cx="' + xs[idx] + '" cy="' + y(vols[idx]) + '" r="4" fill="none" stroke="#152118" stroke-width="1.5"/>';
      } else {
        svg += '<circle cx="' + xs[idx] + '" cy="' + y(vols[idx]) + '" r="4.5" fill="#152118"/>';
        svg += '<circle cx="' + xs[idx] + '" cy="' + y(vols[idx]) + '" r="2" fill="#EFF4E4"/>';
      }
    });
    svg += '</svg>';
    chart.innerHTML = svg;
    chrono.forEach((e, idx) => {
      const lbl = el('dotlabel num' + (e.approx ? ' approx' : ''), (e.approx ? '≈' : '') + Math.round(vols[idx]));
      lbl.style.left = xs[idx] + 'px';
      lbl.style.top = (y(vols[idx]) - 20) + 'px';
      chart.appendChild(lbl);
    });
    body.appendChild(chart);
    body.appendChild(el('chartcap', 'Total volume, kg — weight × reps per session'));
  }

  function stamp(screenId, withChart) {
    const screen = document.getElementById(screenId);
    screen.appendChild(document.getElementById('stage-tpl').content.cloneNode(true));
    if (withChart) screen.querySelector('.volbtn').classList.add('active');
    const body = screen.querySelector('.sheet-body');
    if (withChart) stampChart(body);
    stampLedger(body);
  }

  stamp('screen-a', false);
  stamp('screen-b', true);
</script>
</body>
</html>
