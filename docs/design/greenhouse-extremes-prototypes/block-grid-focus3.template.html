<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>FOCUS WEEK ROUND FOUR — Greenhouse prototype (#435)</title>
<style>
/* THROWAWAY PROTOTYPE — issue #435, round four of /grilling-frontend-prototyping.
   Round-three verdict: pill weeks (A) + the sunlit hour (E) — flat page,
   plain sans voice — but TOO MUCH WHITE SPACE. Fixed in all five: pill
   collapsed weeks, plain sans, flat page, the sunlit-hour light (halo on
   current, panes on inked, morning wash). Varied: what fills the space.
   Variants via ?variant= , day count via ?days=2|3|4|6 :
     a — full house: everything scales up — taller tiles, taller pills,
         bigger type — until the composition fills the screen
     b — open ledger: each collapsed week carries a mini day-strip inside
         its pill, so the whole Block's state fills the space with fact
     c — working header: a block progress band (big count + a bar of
         light) above, and a Continue call-to-action earning the bottom
     d — sunlit room: the counter-argument — sizes unchanged, but the
         morning light expands to fill the page; air becomes lit, not blank
     e — garden bed: the composition breathes — round-three sizes, weeks
         distributed across the full height, space between, not below
     f — inverted ledger: b flipped — collapsed weeks lose their pill and
         go bare (text + day-strip on the paper), the focus week alone
         rides an elevated surface; emphasis lands on the living week
   All variants now carry a PARTIAL day state (a Session started but not
   finished): a quiet fill with an inked progress stripe along the bottom.
*/
/*__FONTS__*/
:root {
  --paper-top: #E8EDDB;
  --paper-bottom: #C7E0BF;
  --ink: #152118;
  --muted: #526457;
  --faint: rgba(82, 100, 87, 0.55);
  --action: #0D6B40;
  --cream: #F2F7E8;
  --pill-fill: rgba(242, 247, 232, 0.85);
  --pill-stroke: rgba(82, 111, 90, 0.34);
  --tile-complete: #0D6B40;
  --tile-complete-text: #F2F7E8;
  --tile-current-fill: rgba(242, 247, 232, 0.95);
  --tile-current-shadow: 0 1px 2px rgba(13, 46, 28, 0.10), 0 8px 18px rgba(13, 60, 35, 0.12);
  --tile-ghost: rgba(21, 33, 24, 0.045);
  --sun-glow: 0 0 0 4px rgba(242, 247, 232, 0.45), 0 2px 18px rgba(220, 235, 190, 0.9);
  --home-bar: rgba(21, 33, 24, 0.20);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  position: relative;
  width: 393px; height: 852px; overflow: hidden;
  background: linear-gradient(180deg, var(--paper-top) 0%, var(--paper-bottom) 100%);
  color: var(--ink);
  font-family: 'Source Sans 3', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.num { font-variant-numeric: tabular-nums; }
.time {
  position: absolute; top: 21px; left: 36px; z-index: 2;
  font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.home-indicator {
  position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); z-index: 2;
  width: 134px; height: 5px; border-radius: 3px; background: var(--home-bar);
}
.col { display: flex; flex-direction: column; width: 393px; height: 852px; padding: 0 28px 34px; overflow: hidden; }

.back { margin-top: 64px; font-size: 15px; font-weight: 600; color: var(--muted); }
h1.block-title {
  margin: 14px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums; color: var(--muted);
}
.block-sub { margin: 7px 0 0; font-size: 13.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* ————— wide tiles: always wider than tall ————— */
.tile-row { display: flex; gap: 8px; }
.tile {
  flex: 1; min-width: 0;
  height: 48px; border-radius: 15px; padding: 0 13px;
  display: flex; align-items: center; justify-content: space-between;
  font-variant-numeric: tabular-nums;
  position: relative; overflow: hidden;
}
.tile.short { height: 40px; padding: 0; justify-content: center; }
.tile .day { font-size: 14.5px; font-weight: 700; line-height: 1; white-space: nowrap; }
.tile.short .day { font-size: 13px; }
.tile .note { font-size: 9.5px; font-weight: 600; }
.tile.complete { background: var(--tile-complete); color: var(--tile-complete-text); }
.tile.current {
  background: var(--tile-current-fill); border: 2px solid #1F8552;
  box-shadow: var(--sun-glow); color: #152118;
}
.tile.current .note { color: var(--action); }
.tile.current::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(90% 160% at 78% -30%, rgba(255, 255, 245, 0.85), transparent 55%);
  pointer-events: none;
}
.tile.available { background: var(--pill-fill); border: 1px solid var(--pill-stroke); }
/* partial: started but not finished — the ink rises partway, like a glass */
.tile.partial { background: var(--pill-fill); border: 1px solid var(--pill-stroke); }
.tile.partial::before {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
  background: var(--tile-complete);
}
.tile.partial.short::before { height: 9px; }
.tile.partial .day { position: relative; }
.tile.partial .note { position: relative; color: var(--action); }
.tile.ghost { background: var(--tile-ghost); color: var(--muted); }
.tile.ghost .day { opacity: 0.75; }
/* panes of light across settled (inked) tiles — locked from round three */
.tile.complete::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(112deg, transparent 32%, rgba(242, 247, 232, 0.20) 40%, rgba(242, 247, 232, 0.06) 47%, transparent 55%, transparent 68%, rgba(242, 247, 232, 0.10) 76%, transparent 84%);
  pointer-events: none;
}
/* the morning wash over the focus section — locked from round three */
.sunwash { position: relative; margin: 0 -28px; padding: 0 28px 18px; }
.sunwash::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 130% at 88% -10%, rgba(250, 252, 238, 0.75), transparent 62%);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 24%, #000 72%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 24%, #000 72%, transparent);
  pointer-events: none;
}
.sunwash > * { position: relative; }

/* full-height stack: the weeks own the whole column below the header */
.stack { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.focus-head {
  margin: 26px 0 11px;
  display: flex; justify-content: space-between; align-items: baseline;
  font-variant-numeric: tabular-nums;
}
.focus-head .wk { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.focus-head .count { color: var(--muted); font-weight: 500; font-size: 12.5px; }

/* ————— collapsed weeks: pill grammar, locked from round three ————— */
.week-pill {
  display: flex; justify-content: space-between; align-items: center;
  height: 50px; border-radius: 16px; padding: 0 16px; margin-top: 10px;
  background: var(--pill-fill); border: 1px solid var(--pill-stroke);
  font-variant-numeric: tabular-nums;
}
.week-pill .wk { font-size: 14px; font-weight: 600; color: var(--muted); }
.week-pill .sum { font-size: 12.5px; font-weight: 500; color: var(--faint); }
.week-pill.done .wk { color: var(--ink); font-weight: 700; }
.week-pill.done .sum { color: var(--action); font-weight: 600; }

/* ————— a · full house: scale eats the space ————— */
body[data-variant="a"] .stack { justify-content: space-between; margin-top: 18px; }
body[data-variant="a"] h1.block-title { font-size: 32px; }
body[data-variant="a"] .block-sub { font-size: 14.5px; margin-top: 8px; }
body[data-variant="a"] .tile {
  height: 72px; border-radius: 20px; padding: 0 18px;
  flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px;
}
body[data-variant="a"] .tile.short { height: 46px; border-radius: 14px; flex-direction: row; align-items: center; }
body[data-variant="a"] .tile .day { font-size: 17px; }
body[data-variant="a"] .tile.short .day { font-size: 15px; }
body[data-variant="a"] .tile .note { font-size: 11px; }
body[data-variant="a"] .tile-row { gap: 9px; }
body[data-variant="a"] .week-pill { height: 84px; border-radius: 24px; margin-top: 0; padding: 0 22px; }
body[data-variant="a"] .week-pill .wk { font-size: 17px; }
body[data-variant="a"] .week-pill .sum { font-size: 14.5px; }
body[data-variant="a"] .focus-head { margin: 0 0 15px; }
body[data-variant="a"] .focus-head .wk { font-size: 26px; }
body[data-variant="a"] .focus-head .count { font-size: 14px; }
body[data-variant="a"] .sunwash { padding-bottom: 0; }

/* ————— b · open ledger: mini day-strips inside collapsed pills ————— */
.week-pill.strip {
  height: auto; flex-direction: column; align-items: stretch; justify-content: center;
  gap: 8px; padding: 12px 15px; border-radius: 18px;
}
.week-pill.strip .toprow { display: flex; justify-content: space-between; align-items: baseline; }
.chip-row { display: flex; gap: 5px; }
.chip { flex: 1; height: 16px; border-radius: 6px; position: relative; overflow: hidden; }
.chip.complete { background: var(--tile-complete); }
.chip.complete::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(112deg, transparent 40%, rgba(242, 247, 232, 0.18) 50%, transparent 62%);
}
.chip.available { background: var(--pill-fill); border: 1px solid var(--pill-stroke); }
.chip.partial { background: var(--pill-fill); border: 1px solid var(--pill-stroke); }
.chip.partial::before {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
  background: var(--tile-complete);
}
.chip.current { background: var(--tile-current-fill); border: 1.5px solid #1F8552; }
.chip.ghost { background: var(--tile-ghost); }
body[data-variant="b"] .stack { justify-content: space-evenly; margin-top: 4px; }
body[data-variant="b"] .week-pill.strip { gap: 10px; padding: 15px 17px; }
body[data-variant="b"] .chip { height: 22px; border-radius: 8px; }
body[data-variant="b"] .week-pill { margin-top: 0; }
body[data-variant="b"] .focus-head { margin: 0 0 11px; }
body[data-variant="b"] .sunwash { padding-bottom: 0; }

/* ————— c · working header: a progress band + dated focus week ————— */
.progress-band { margin-top: 22px; font-variant-numeric: tabular-nums; }
.progress-band .figures { display: flex; align-items: baseline; gap: 8px; }
.progress-band .big { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; line-height: 1; }
.progress-band .of { font-size: 15px; font-weight: 600; color: var(--muted); }
.progress-band .what { font-size: 12.5px; font-weight: 500; color: var(--faint); margin-left: auto; }
.lightbar { margin-top: 13px; height: 7px; border-radius: 4px; background: rgba(21, 33, 24, 0.07); position: relative; overflow: hidden; }
.lightbar .fill {
  position: absolute; inset: 0 auto 0 0; border-radius: 4px;
  background: linear-gradient(90deg, var(--action), #3F9A63 78%, #BFE3A6 100%);
  box-shadow: 0 0 10px rgba(220, 235, 190, 0.9);
}
.focus-meta { margin: -5px 0 12px; font-size: 12.5px; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
body[data-variant="c"] .focus-head { margin-bottom: 5px; }
/* c: the bottom is earned by the one action this screen serves */
.next-cta {
  margin-top: auto;
  height: 58px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--tile-current-fill); border: 2px solid #1F8552;
  box-shadow: var(--sun-glow);
  font-size: 16px; font-weight: 700; color: var(--ink);
  position: relative; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.next-cta::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(90% 160% at 78% -30%, rgba(255, 255, 245, 0.85), transparent 55%);
  pointer-events: none;
}
.next-cta .arrow { color: var(--action); font-weight: 700; }

/* ————— d · sunlit room: the light expands to fill the page ————— */
body[data-variant="d"]::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(130% 80% at 86% -6%, rgba(253, 254, 242, 0.98), rgba(250, 252, 238, 0.5) 48%, transparent 78%),
    radial-gradient(110% 62% at -14% 106%, rgba(251, 253, 239, 0.75), transparent 64%);
}
body[data-variant="d"]::after {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(112deg,
    transparent 0 84px, rgba(253, 254, 244, 0.55) 84px 128px,
    transparent 128px 196px, rgba(253, 254, 244, 0.30) 196px 228px);
  -webkit-mask-image: radial-gradient(170% 150% at 88% -8%, #000 36%, transparent 88%);
  mask-image: radial-gradient(170% 150% at 88% -8%, #000 36%, transparent 88%);
}
body[data-variant="d"] .col { position: relative; z-index: 1; }
body[data-variant="d"] .sunwash::before { background: none; }

/* ————— e · garden bed: the composition breathes across full height ————— */
body[data-variant="e"] .stack { justify-content: space-evenly; margin-top: 6px; }

/* ————— f · inverted ledger: bare collapsed weeks, elevated focus week ————— */
.week-flat { padding: 4px 2px; font-variant-numeric: tabular-nums; }
.week-flat .toprow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.week-flat .wk { font-size: 14px; font-weight: 600; color: var(--faint); }
.week-flat .sum { font-size: 12.5px; font-weight: 500; color: var(--faint); }
.week-flat.done .wk { color: var(--muted); font-weight: 700; }
.week-flat.done .sum { color: var(--action); font-weight: 600; }
.week-flat .chip { opacity: 0.82; }
.focus-surface {
  margin: 0 -12px; padding: 4px 18px 18px;
  background: rgba(242, 247, 232, 0.55); border-radius: 24px;
  box-shadow: 0 1px 2px rgba(21, 33, 24, 0.05), 0 16px 34px rgba(21, 33, 24, 0.10);
  position: relative; overflow: hidden;
}
.focus-surface::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 140% at 85% -12%, rgba(253, 254, 242, 0.9), transparent 60%);
  pointer-events: none;
}
.focus-surface > * { position: relative; }
.focus-surface .focus-head { margin-top: 14px; }
body[data-variant="f"] .stack { justify-content: space-evenly; margin-top: 6px; }
body[data-variant="e"] .week-pill { margin-top: 0; }
body[data-variant="e"] .focus-head { margin: 0 0 11px; }
body[data-variant="e"] .sunwash { padding: 0 28px 0; }

/* ————— switcher (NOT part of the design) ————— */
.switcher {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; align-items: center; gap: 2px;
  background: #111; color: #fff; border-radius: 999px; padding: 4px 6px;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.5);
}
.switcher a { color: #fff; text-decoration: none; padding: 2px 7px; font-size: 14px; line-height: 1; }
.switcher .label { padding: 0 6px; white-space: nowrap; }
.switcher .days { display: flex; gap: 1px; margin-left: 4px; border-left: 1px solid #444; padding-left: 5px; }
.switcher .days a { font-size: 12px; padding: 2px 6px; border-radius: 999px; color: #bbb; }
.switcher .days a.on { background: #fff; color: #111; }
</style>
</head>
<body data-variants="a,b,c,d,e" data-variant="a">

<div class="time num" id="clock">9:41</div>
<div class="col" id="page"></div>
<div class="home-indicator"></div>

<nav class="switcher">
  <a id="sw-prev" href="#">‹</a>
  <span class="label" id="sw-label"></span>
  <a id="sw-next" href="#">›</a>
  <span class="days" id="sw-days"></span>
</nav>

<script>
  const KEYS = ['a', 'b', 'c', 'd', 'e', 'f'];
  const NAMES = {
    a: 'A · Full house',
    b: 'B · Open ledger',
    c: 'C · Working header',
    d: 'D · Sunlit room',
    e: 'E · Garden bed',
    f: 'F · Inverted ledger'
  };
  const DAY_CHOICES = [2, 3, 4, 6];
  const params = new URLSearchParams(location.search);
  const key = KEYS.includes(params.get('variant')) ? params.get('variant') : 'a';
  const days = DAY_CHOICES.includes(+params.get('days')) ? +params.get('days') : 6;
  document.body.dataset.variant = key;
  const i = KEYS.indexOf(key);
  document.getElementById('sw-label').textContent = NAMES[key];
  const href = (v, d) => '?variant=' + v + '&days=' + d;
  document.getElementById('sw-prev').href = href(KEYS[(i + KEYS.length - 1) % KEYS.length], days);
  document.getElementById('sw-next').href = href(KEYS[(i + 1) % KEYS.length], days);
  document.getElementById('sw-days').innerHTML = DAY_CHOICES.map((d) =>
    '<a href="' + href(key, d) + '"' + (d === days ? ' class="on"' : '') + '>' + d + 'd</a>').join('');

  function makeBlock(n) {
    // week 1 carries one partial Session (started, never finished)
    const w1 = Array.from({ length: n }, (_, d) => (d === n - 1 ? 'partial' : 'complete'));
    const w2 = Array.from({ length: n }, (_, d) => {
      const cur = Math.ceil(n / 2);
      return d === cur - 1 ? 'partial' : d < cur ? 'complete' : d === cur ? 'current' : 'available';
    });
    const w3 = Array.from({ length: n }, (_, d) => (d % 2 === 0 ? 'available' : 'ghost'));
    const w4 = Array.from({ length: n }, (_, d) => (d === 0 ? 'available' : 'ghost'));
    return [w1, w2, w3, w4].map((daysArr, wi) => ({ week: wi + 1, days: daysArr }));
  }
  const BLOCK = makeBlock(days);
  const FOCUS = BLOCK.findIndex((w) => w.days.includes('current'));
  const doneCount = (w) => w.days.filter((d) => d === 'complete').length;
  const partialCount = (w) => w.days.filter((d) => d === 'partial').length;
  const ghostCount = (w) => w.days.filter((d) => d === 'ghost').length;
  const isDone = (w) => doneCount(w) === w.days.length;
  const total = BLOCK.reduce((s, w) => s + w.days.length, 0);
  const done = BLOCK.reduce((s, w) => s + doneCount(w), 0);
  const ghosts = BLOCK.reduce((s, w) => s + ghostCount(w), 0);

  const page = document.getElementById('page');
  const el = (cls, html, tag) => {
    const d = document.createElement(tag || 'div');
    d.className = cls; d.innerHTML = html || '';
    return d;
  };
  function header(band) {
    page.appendChild(el('back', '‹ Session'));
    page.appendChild(el('block-title num', 'Block 27', 'h1'));
    if (band) {
      const b = el('progress-band');
      b.appendChild(el('figures',
        '<span class="big num">' + done + '</span><span class="of num">of ' + total +
        ' Sessions</span><span class="what num">' + (ghosts ? ghosts + ' not yet uploaded' : 'all uploaded') + '</span>'));
      const bar = el('lightbar');
      const fill = el('fill');
      fill.style.width = Math.max(4, Math.round((done / total) * 100)) + '%';
      bar.appendChild(fill);
      b.appendChild(bar);
      page.appendChild(b);
    } else {
      page.appendChild(el('block-sub num',
        done + ' of ' + total + ' Sessions complete' + (ghosts ? ' · ' + ghosts + ' not yet uploaded' : '')));
    }
  }
  function summary(w) {
    if (isDone(w)) return 'Complete';
    let s = doneCount(w) + ' of ' + w.days.length;
    if (partialCount(w)) s += ' · ' + partialCount(w) + ' in progress';
    if (ghostCount(w)) s += ' · ' + ghostCount(w) + ' not uploaded';
    return s;
  }
  function focusRight(w) {
    let t = doneCount(w) + ' of ' + w.days.length;
    if (days >= 5 && ghostCount(w)) t += ' · ' + ghostCount(w) + ' not uploaded';
    return t;
  }
  // wide tiles: at ≤4 days the label sits left with the state word right;
  // at ≥5 days tiles go short + centered D-labels
  function tileEl(state, di) {
    const short = days >= 5;
    const t = el('tile ' + state + (short ? ' short' : '') + ' num');
    const day = short ? 'D' + (di + 1) : 'Day ' + (di + 1);
    let note = '';
    if (!short) {
      note = state === 'current' ? '<span class="note">Current</span>' :
             state === 'partial' ? '<span class="note">Started</span>' :
             state === 'ghost' ? '<span class="note">Not uploaded</span>' : '';
    }
    t.innerHTML = '<span class="day">' + day + '</span>' + note;
    return t;
  }
  function focusTiles(w) {
    const row = el('tile-row');
    w.days.forEach((state, di) => row.appendChild(tileEl(state, di)));
    return row;
  }
  function focusHead(w) {
    return el('focus-head',
      '<span class="wk num">Week ' + w.week + '</span><span class="count num">' + focusRight(w) + '</span>');
  }
  function collapsedEl(w, strips) {
    if (strips === 'flat') {
      const p = el('week-flat num' + (isDone(w) ? ' done' : ''));
      p.appendChild(el('toprow',
        '<span class="wk">Week ' + w.week + '</span><span class="sum">' + summary(w) + '</span>'));
      const row = el('chip-row');
      w.days.forEach((state) => row.appendChild(el('chip ' + state)));
      p.appendChild(row);
      return p;
    }
    if (strips) {
      const p = el('week-pill strip num' + (isDone(w) ? ' done' : ''));
      p.appendChild(el('toprow',
        '<span class="wk">Week ' + w.week + '</span><span class="sum">' + summary(w) + '</span>'));
      const row = el('chip-row');
      w.days.forEach((state) => row.appendChild(el('chip ' + state)));
      p.appendChild(row);
      return p;
    }
    return el('week-pill num' + (isDone(w) ? ' done' : ''),
      '<span class="wk">Week ' + w.week + '</span><span class="sum">' + summary(w) + '</span>');
  }

  // what fills the space, per variant
  const OPTS = {
    a: { strips: false, band: false, meta: false, stack: true, cta: false, surface: false },
    b: { strips: true, band: false, meta: false, stack: true, cta: false, surface: false },
    c: { strips: false, band: true, meta: true, stack: false, cta: true, surface: false },
    d: { strips: false, band: false, meta: false, stack: false, cta: false, surface: false },
    e: { strips: false, band: false, meta: false, stack: true, cta: false, surface: false },
    f: { strips: 'flat', band: false, meta: false, stack: true, cta: false, surface: true }
  }[key];

  header(OPTS.band);
  const host = OPTS.stack ? el('stack') : page;
  BLOCK.forEach((w, wi) => {
    if (wi !== FOCUS) {
      host.appendChild(collapsedEl(w, OPTS.strips));
      return;
    }
    const wrap = el(OPTS.surface ? 'focus-surface' : 'sunwash');
    wrap.appendChild(focusHead(w));
    if (OPTS.meta) wrap.appendChild(el('focus-meta num', 'May 26 – Jun 1 · Current Session: Day ' +
      (w.days.indexOf('current') + 1)));
    wrap.appendChild(focusTiles(w));
    host.appendChild(wrap);
  });
  if (OPTS.stack) page.appendChild(host);
  if (OPTS.cta) {
    const w = BLOCK[FOCUS];
    page.appendChild(el('next-cta num',
      'Continue — Week ' + w.week + ' · Day ' + (w.days.indexOf('current') + 1) + ' <span class="arrow">›</span>'));
  }
</script>
</body>
</html>
