<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Gill Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c7a3f"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #0f6674; stroke-width: 1.6; rx: 8; }
    .consumer { fill: #f2f2ee; stroke: #999; stroke-dasharray: none; }
    .external { fill: #f0f7f1; stroke: #2c7a3f; stroke-dasharray: 6 4; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .doors { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; fill: #0f6674; }
    .depth { font-size: 10px; fill: #888; }
    .arrow { stroke: #555; stroke-width: 1.4; fill: none; }
    .netarrow { stroke: #2c7a3f; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .arrowlabel { font-size: 9.5px; fill: #777; }
  </style>

  <!-- ===== Row 0: consumers ===== -->
  <rect class="box consumer" x="40" y="20" width="600" height="78" rx="8"/>
  <text class="title" x="56" y="44">Views</text>
  <text class="doors" x="56" y="62" fill="#666">RootView · SessionView · SessionStageView · BlockOverviewView · SettingsView …</text>
  <text class="depth" x="56" y="80">30 files · ~5,300 LOC — consumers of the interfaces below, not a deep module</text>

  <rect class="box" x="680" y="20" width="220" height="78" rx="8"/>
  <text class="title" x="696" y="44">Theme</text>
  <text class="doors" x="696" y="62">Theme.Palette (env key)</text>
  <text class="depth" x="696" y="80">~30 tokens · ~380 LOC beneath</text>

  <!-- ===== Row 1: stores + progress ===== -->
  <rect class="box" x="40" y="150" width="390" height="130" rx="8"/>
  <text class="title" x="56" y="176">Stores</text>
  <text class="doors" x="56" y="196">WorkoutStore · SyncCoordinator</text>
  <text class="doors" x="56" y="212">SettingsStore · LastPerformedLookupStore</text>
  <text class="depth" x="56" y="234">4 @Observable front doors · ~2,060 LOC beneath</text>
  <text class="depth" x="56" y="250">the app's memory: cache, sync, queued writes</text>

  <rect class="box" x="470" y="150" width="430" height="130" rx="8"/>
  <text class="title" x="486" y="176">Progress</text>
  <text class="doors" x="486" y="196">SessionProgressTracker (pure) · SessionCoordinator (stateful)</text>
  <text class="doors" x="486" y="212">LastPerformedIndex · presentation structs</text>
  <text class="depth" x="486" y="234">2 front doors · ~3,600 LOC beneath — the largest iceberg</text>
  <text class="depth" x="486" y="250">the rules of “what's next”: progression, focus, supersets, rest</text>

  <!-- ===== Row 2: sheets + parsing + load suggestion ===== -->
  <rect class="box" x="40" y="345" width="250" height="115" rx="8"/>
  <text class="title" x="56" y="371">Sheets</text>
  <text class="doors" x="56" y="391">SheetsClient (protocol)</text>
  <text class="doors" x="56" y="407">SheetWriter · GoogleAuth</text>
  <text class="depth" x="56" y="429">5-method protocol · ~820 LOC beneath</text>
  <text class="depth" x="56" y="445">the only door to the outside world</text>

  <rect class="box" x="330" y="345" width="270" height="115" rx="8"/>
  <text class="title" x="346" y="371">Parsing</text>
  <text class="doors" x="346" y="391">SheetParser · SheetLayoutInterpreter</text>
  <text class="doors" x="346" y="407">ParsedBlock DTOs · BlockBuilder</text>
  <text class="depth" x="346" y="429">2 structs · ~930 LOC beneath</text>
  <text class="depth" x="346" y="445">raw grid in → interpreted Block out; never touches the network</text>

  <rect class="box" x="640" y="345" width="260" height="80" rx="8"/>
  <text class="title" x="656" y="371">LoadSuggestionEngine</text>
  <text class="doors" x="656" y="391">suggest(prescribedLoad:…) → Double?</text>
  <text class="depth" x="656" y="411">1 pure function · 60 LOC</text>

  <!-- ===== Row 3: models + external world ===== -->
  <rect class="box" x="40" y="535" width="590" height="95" rx="8"/>
  <text class="title" x="56" y="561">Models</text>
  <text class="doors" x="56" y="581">Block · Week · Session · Exercise · ExerciseSet · SetLog · SetState · PendingWrite</text>
  <text class="depth" x="56" y="603">~430 LOC, mostly interface — the shared vocabulary every other</text>
  <text class="depth" x="56" y="617">interface speaks; depends on nothing</text>

  <rect class="box external" x="680" y="535" width="220" height="95" rx="8"/>
  <text class="title" x="696" y="561" fill="#2c7a3f">Google Sheet</text>
  <text class="depth" x="696" y="581">coach-managed · source of truth</text>
  <text class="depth" x="696" y="597">(ADR-0001)</text>

  <!-- ===== Dependency arrows (A → B: A's interface/impl uses B) ===== -->
  <line class="arrow" x1="230" y1="98" x2="230" y2="146" marker-end="url(#dep)"/>
  <line class="arrow" x1="560" y1="98" x2="560" y2="146" marker-end="url(#dep)"/>
  <line class="arrow" x1="640" y1="59" x2="676" y2="59" marker-end="url(#dep)"/>
  <line class="arrow" x1="430" y1="215" x2="466" y2="215" marker-end="url(#dep)"/>
  <line class="arrow" x1="140" y1="280" x2="140" y2="341" marker-end="url(#dep)"/>
  <line class="arrow" x1="380" y1="280" x2="415" y2="341" marker-end="url(#dep)"/>
  <line class="arrow" x1="545" y1="280" x2="515" y2="341" marker-end="url(#dep)"/>
  <line class="arrow" x1="770" y1="280" x2="770" y2="341" marker-end="url(#dep)"/>
  <line class="arrow" x1="290" y1="400" x2="326" y2="400" marker-end="url(#dep)"/>
  <line class="arrow" x1="140" y1="460" x2="140" y2="531" marker-end="url(#dep)"/>
  <line class="arrow" x1="360" y1="460" x2="360" y2="531" marker-end="url(#dep)"/>
  <line class="arrow" x1="620" y1="280" x2="620" y2="531" marker-end="url(#dep)"/>

  <!-- Network edge: the only path bytes travel in or out -->
  <path class="netarrow" d="M 250 460 C 400 520, 560 545, 676 570" marker-end="url(#net)"/>
  <text class="arrowlabel" x="400" y="512" fill="#2c7a3f">HTTPS — sync reads &amp; batched writes</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(660, 445)">
    <line class="arrow" x1="0" y1="10" x2="34" y2="10" marker-end="url(#dep)"/>
    <text class="arrowlabel" x="42" y="13">depends on (uses that interface)</text>
    <line class="netarrow" x1="0" y1="30" x2="34" y2="30" marker-end="url(#net)"/>
    <text class="arrowlabel" x="42" y="33">network — crosses the app boundary</text>
    <text class="arrowlabel" x="0" y="55" font-style="italic">All solid arrows point downward:</text>
    <text class="arrowlabel" x="0" y="69" font-style="italic">every interface bottoms out in Models.</text>
  </g>
</svg>
