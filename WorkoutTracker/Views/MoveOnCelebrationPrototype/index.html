<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Move On Celebration Prototype</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <nav class="prototype-switcher" aria-label="Prototype variants">
      <button id="previousVariant" type="button" aria-label="Previous variant">‹</button>
      <span id="variantLabel"></span>
      <button id="nextVariant" type="button" aria-label="Next variant">›</button>
    </nav>
    <script src="./app.js"></script>
  </body>
</html>
